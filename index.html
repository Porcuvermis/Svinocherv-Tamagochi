<!DOCTYPE html>
<!-- style на самом <html> — не украшение, а самый ранний способ задать
     цвет: он применяется при разборе первых байтов страницы, до стилей и
     скриптов. Без него WebView успевает показать свой белый фон. -->
<html lang="ru" style="background-color: #000">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Свиночервь">
    <meta name="theme-color" content="#000000">
    <!-- Браузер до разбора страницы рисует свой «холст», и по умолчанию он
         СВЕТЛЫЙ — отсюда белая вспышка на тёмном сайте. color-scheme —
         единственный способ сказать про это заранее, ещё до стилей: холст
         становится тёмным. Мета-тег, а не только CSS, потому что читается
         он раньше всего остального. -->
    <meta name="color-scheme" content="dark">
    <!-- BUILD подставляется при деплое (.github/workflows/deploy-pages.yml).
         В репозитории всегда 'dev': значит файл открыт не с Pages. -->
    <meta name="app-build" content="__BUILD__">
    <meta name="app-branch" content="__BRANCH__">
    <title>Свиночервь Тамагочи</title>

    <!-- ================= ЭКРАН ЗАГРУЗКИ: КРИТИЧНАЯ ЧАСТЬ =================
         Стили и класс пелены лежат прямо здесь, а не в файлах, и это
         единственная причина, по которой они вообще написаны инлайном:
         всё, что подключается ссылкой, — это запрос в сеть ДО первого
         кадра. Пока такой запрос идёт, экран показывает не игру и не
         черноту, а белый фон вебвью. Именно так и получалась вспышка
         белым: сначала блокирующий <script>, потом восемь таблиц стилей,
         и только потом первый чёрный пиксель.

         Здесь запросов нет вообще: страница чернеет на первом же кадре.
         Логика (когда открывать, чего ждать) — в src/core/boot-screen.js,
         он подключён в конце <body> и первый кадр уже не задерживает. -->
    <style>
        /* То же самое, что мета-тег выше, но уже для стилей: тёмные
           умолчания браузера вместо светлых. */
        :root { color-scheme: dark; }

        html.boot-veil, html.boot-veil body { background: #000; }

        /* Игра обрезана в точку и не видна, но живёт: считает, строит HUD,
           рисует первый кадр персонажа — всё под чернотой. */
        html.boot-veil #game-container {
            -webkit-clip-path: circle(0% at 50% 50%);
            clip-path: circle(0% at 50% 50%);
        }

        /* Открытие: круг едет из центра до 150% — то есть заведомо за углы
           экрана. После анимации boot-screen.js снимает оба класса, и
           clip-path исчезает совсем: на мини-игры (они position:fixed
           внутри контейнера) обрезка не влияет. */
        html.boot-veil.boot-open #game-container {
            -webkit-clip-path: circle(150% at 50% 50%);
            clip-path: circle(150% at 50% 50%);
            -webkit-transition: -webkit-clip-path 1100ms cubic-bezier(0.22, 0.61, 0.36, 1);
            transition: clip-path 1100ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        /* Пульс включается с задержкой в 1.3 с: быстрый запуск остаётся
           просто чёрным, а долгое ожидание перестаёт выглядеть зависанием.
           Цвет — PALETTE.flesh[500], продублирован числом намеренно:
           палитра грузится позже, а пелена нужна с первого кадра. */
        html.boot-veil::after {
            content: '';
            position: fixed;
            left: 50%;
            top: 50%;
            width: 140px;
            height: 140px;
            margin: -70px 0 0 -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167, 88, 99, 0.45) 0%, rgba(167, 88, 99, 0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 2147483646;
            animation: boot-veil-pulse 2.2s ease-in-out 1.3s infinite;
        }
        html.boot-veil.boot-open::after { animation: boot-veil-out 220ms linear forwards; }

        @keyframes boot-veil-pulse {
            0%, 100% { opacity: 0.12; transform: scale(0.85); }
            50%      { opacity: 0.55; transform: scale(1.08); }
        }
        @keyframes boot-veil-out { to { opacity: 0; } }

        /* Уход в чёрное перед перезагрузкой на новую сборку (см. boot.js):
           не моргаем, а гасим экран. */
        #boot-cover {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            opacity: 0;
            z-index: 2147483647;
            transition: opacity 300ms linear;
        }
        #boot-cover.on { opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            html.boot-veil.boot-open #game-container {
                -webkit-transition: -webkit-clip-path 200ms linear;
                transition: clip-path 200ms linear;
            }
            html.boot-veil::after { animation: none; }
        }
    </style>
    <script>
        // Класс ставится скриптом, а не написан в самом теге <html>,
        // сознательно: без JS пелену будет некому снять, и игра не
        // откроется вообще. Нет JS — нет и пелены, игра просто видна сразу.
        document.documentElement.classList.add('boot-veil');
        // Предохранитель на случай, если boot-screen.js не доехал или упал:
        // чёрный экран навсегда — это худший исход из всех возможных.
        window.__bootFailsafe = setTimeout(function () {
            document.documentElement.classList.remove('boot-veil', 'boot-open');
        }, 8000);

        // Отметка «экран стал чёрным». Ставится здесь, а не берётся из
        // performance-метрик браузера: те считают только ОСМЫСЛЕННУЮ
        // отрисовку, а под пеленой ничего осмысленного не видно, и число
        // получается про открытие игры, а не про черноту. Вложенный
        // requestAnimationFrame — это «после первого показанного кадра».
        // Видно в debug-режиме (кнопка 🐞), нужно для разбора вспышки
        // белым на запуске: доли миллисекунд здесь означают, что страница
        // ни при чём и белое показывает система до неё.
        window.__bootMarks = {};
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                window.__bootMarks.firstFrame = performance.now();
            });
        });
    </script>

    <!-- ВСЕ таблицы стилей подключены НЕ блокирующе, и это не
         микрооптимизация. Обычный <link rel="stylesheet"> запрещает браузеру
         рисовать что бы то ни было, пока не загрузится ПОСЛЕДНИЙ из них:
         восемь файлов, 92 КБ, восемь запросов — и всё это стоит перед первым
         же кадром, то есть перед чернотой экрана загрузки. Пока они едут,
         экран белый. Ровно это и оставалось от вспышки после того, как из
         критического пути убрали сеть.

         media="print" снимает блокировку (браузер считает файл ненужным для
         экрана и качает его спокойно), а onload возвращает media="all" —
         стили применяются, как только приехали.

         Позволить себе это можно только благодаря пелене: она чёрная от
         инлайн-стилей выше, ничего не требует и держится до window.load, то
         есть до момента, когда все эти файлы УЖЕ применены. Несобранного
         интерфейса игрок не увидит — он увидит черноту. -->
    <link rel="stylesheet" href="style.css?v=14" media="print" onload="this.media='all'">
    <!-- Общее окно мини-игры (рамка, шапка, вопрос при выходе). Строго ДО

    <div id="sloth-game" class="minigame-screen" data-sin="sloth">
        <svg id="gd-svg" class="gd-svg" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <!-- Участок: координаты сцены, по ней ездит камера вбок. -->
            <g id="gd-cam"></g>
            <!-- Передний план: инструменты в координатах ЭКРАНА. Их держат
                 перед собой, поэтому они не уезжают вместе с грядками. -->
            <g id="gd-fg"></g>
        </svg>

        <!-- Шкала лени. Без неё игрок делает действия и не понимает, зачем:
             связь «повозился в саду — лень закрылась» и есть весь смысл этой

        <div class="gd-gauge-wrap" id="gd-gauge-wrap">

        </div>

    <!-- ПОХОТЬ: ВАННАЯ.
         Окно (рамка, крестик, вопрос при выходе) надевает
         src/core/minigame-window.js — здесь только содержимое (инвариант 8).
         Предметы комнаты приходят из ЗАПЕЧЁННОГО
         (src/minigames/lust/bath-baked.js), который сгенерирован из 3д-моделей
         и лежит в репозитории готовым: three.js в рантайм не попадает
         (docs/bake-3d.md).

         Холстов ДВА, и между ними — слой червя. Рендерер персонажа монтирует
         свой собственный svg в html-контейнер, вложить его в группу сцены
         нельзя; значит комната разрезана там, где должен быть червь — по
         поверхности воды. Иначе он плавает поверх неё, а не лежит в ней. -->
    <div id="lust-game" class="minigame-screen" data-sin="lust">
        <svg id="bt-back" class="bt-svg" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <!-- Комната и чаша: координаты сцены, по ней ездит камера. -->
            <g id="bt-cam-back"></g>
        </svg>
        <!-- ДОЖДЬ ЖИВЁТ В СВОИХ ХОЛСТАХ, а не в группах комнаты, и это не
             вкусовщина, а самая дорогая правка кадра во всей ванной.

             Пока струйки лежали внутри общего svg и каждая ехала своей
             анимацией, каждый их кадр помечал грязной всю область экрана, и
             браузер перерисовывал ВСЮ комнату — две тысячи узлов — шестьдесят
             раз в секунду.

             Теперь узор дождя ПЕРИОДИЧЕН по вертикали и едет ЦЕЛИКОМ, одной
             анимацией на холст. Проехав ровно свой шаг, картинка совпадает
             сама с собой, и стыка не видно. Холст растрируется ОДИН РАЗ, а
             дальше видеокарта двигает готовую текстуру: ни отрисовки, ни
             пересчёта стиля.

             Обёртка снаружи — НЕПОДВИЖНАЯ, и она обрезает верх. Обрезать
             изнутри нельзя: css-обрезка применяется до трансформации и
             поехала бы вместе с узором. Снизу обрезать нечего — там всё
             закрывает чаша.

             Холста два, потому что дождь и должен быть по обе стороны от
             червя: дальний — за ним, ближний — перед. -->
        <div id="bt-rain-far" class="bt-rain-clip">
            <svg class="bt-rain-move" viewBox="0 0 390 844"
                 preserveAspectRatio="xMidYMid slice">
                <g id="bt-cam-rain-far"></g>
            </svg>
        </div>
        <!-- Червь: общая моделька игрока, своего рисунка у ванной нет. -->
        <div id="bt-worm" class="bt-worm-host"></div>
        <!-- Состояние мытья: ОДИН холст на всё. Не два (муть отдельно, пена
             отдельно): пока они были разными слоями, «намылено» и «оттёрто»
             складывались в одно бледное пятно, и по картинке нельзя было
             понять, что уже сделано. Теперь у клетки одно состояние и один
             вид. Холст, а не фигуры в svg: след обязан обрезаться по силуэту
             червя, а сотни полупрозрачных пятен убивали кадры. -->
        <canvas id="bt-wash" class="bt-lather"></canvas>
        <div id="bt-rain-near" class="bt-rain-clip">
            <svg class="bt-rain-move" viewBox="0 0 390 844"
                 preserveAspectRatio="xMidYMid slice">
                <g id="bt-cam-rain-near"></g>
            </svg>
        </div>
        <!-- ТРИ ХОЛСТА ВМЕСТО ОДНОГО, и делит их не порядок рисования, а
             ЧАСТОТА ИЗМЕНЕНИЙ. Хвост, пена и пузыри шевелятся каждый кадр —
             им свой холст под чашей; струи и шкала тоже — им свой над.
             Между ними чаша, и она не меняется никогда, поэтому её и не
             перерисовывают.

             Пока всё лежало в одном холсте, каждое движение хвоста метило
             грязной область чаши, и запечённая чаша перерисовывалась
             шестьдесят раз в секунду. Замер (6× замедления, плотность 3):
             Paint 689 мс против 229, 45 кадров против 60. -->
        <svg id="bt-under" class="bt-svg bt-fast" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <g id="bt-cam-under"></g>
        </svg>
        <svg id="bt-svg" class="bt-svg" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <!-- Чаша: статика, той же камерой. -->
            <g id="bt-cam"></g>
            <!-- Передний план: предмет в руке в координатах ЭКРАНА. Его
                 держат перед собой, поэтому он не уезжает вместе с комнатой. -->
            <g id="bt-fg"></g>
        </svg>
        <svg id="bt-over" class="bt-svg bt-fast" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <g id="bt-cam-over"></g>
        </svg>
    </div>

    <!-- ЧРЕВОУГОДИЕ: КУХНЯ.

         Вся кухня — ОДИН svg, который целиком рисует kitchen-art.js: разметки
         у предметов нет и быть не должно, иначе картинка окажется размазана
         между двумя файлами. Камера — transform на группе #kt-cam. -->
    <div id="gluttony-game" class="minigame-screen" data-sin="gluttony">

        <svg id="kt-svg" class="kt-svg" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <!-- Кухня: координаты сцены, по ней ездит камера. -->
            <g id="kt-cam"></g>
            <!-- Передний план: доска и нож в координатах ЭКРАНА. Они ближе
                 камеры, поэтому ей не подчиняются — доска въезжает и выезжает
                 сама, а не уползает вместе с кухней. -->
            <g id="kt-fg"></g>
        </svg>

        <!-- КОРМЁЖКА. Этап работает и переписывать его незачем: меняется
             только то, что происходит до него. -->
        <div class="glut-stage glut-stage-feed" id="glut-stage-feed">
            <div class="glut-feed-scene">
                <div class="glut-tilt-bucket" id="glut-tilt-bucket"></div>
                <div class="glut-pour-layer" id="glut-pour-layer"></div>
            </div>
            <div class="glut-gauge-wrap">
                <div class="glut-gauge-bar" id="glut-gauge-bar"></div>
            </div>
        </div>

        <!-- ИТОГ БЕЗ СЛОВ: размер кучки и сколько осколков она принесла -->
        <div class="glut-win-overlay" id="glut-win-overlay">
            <div class="kt-result" id="kt-result"></div>
        </div>
    </div>

    <div id="pride-game" class="minigame-screen">
        <div class="pride-modal">
            <button id="pride-close-btn" class="pride-close-btn">&times;</button>
            <div class="pride-title">ТЩЕСЛАВИЕ</div>

            <div class="pride-field-frame">
                <div class="pride-field" id="pride-field">
                    <div class="pride-pedestal" id="pride-pedestal"></div>
                    <div class="pride-worm-stage" id="pride-worm-stage"></div>
                    <div class="pride-targets-layer" id="pride-targets-layer"></div>
                    <div class="pride-fx-layer" id="pride-fx-layer"></div>
                    <div class="pride-field-glow" id="pride-field-glow"></div>
                </div>
            </div>

            <div class="pride-gauge-wrap">
                <div class="pride-gauge-bar" id="pride-gauge-bar"></div>
            </div>

            <div class="pride-win-overlay" id="pride-win-overlay">
                <div class="pride-win-flash"></div>
                <div class="pride-win-text">ВЕЛИКОЛЕПНО!</div>
                <div class="pride-win-sub">Все тобой восхищаются!</div>
            </div>
        </div>
    </div>

    <div id="envy-game" class="minigame-screen">
        <div class="envy-modal">
            <button id="envy-close-btn" class="envy-close-btn">&times;</button>

            <canvas id="envy-canvas"></canvas>

            <div class="envy-gauge-wrap">
                <div class="envy-gauge-bar" id="envy-gauge-bar"></div>
            </div>

            <!-- Победная вспышка: разрастается из последнего правильного образа -->
            <div class="envy-win-flash" id="envy-win-flash"></div>

            <div class="envy-win-overlay" id="envy-win-overlay">
                <div class="envy-win-text">Назавидовал</div>
            </div>

            <div class="envy-confirm-overlay" id="envy-confirm-overlay">
                <div class="envy-confirm-text">Выйти из мини-игры? Прогресс не сохранится.</div>
                <div class="envy-confirm-buttons">
                    <button id="envy-confirm-stay" class="envy-confirm-btn stay">Остаться</button>
                    <button id="envy-confirm-leave" class="envy-confirm-btn leave">Выйти</button>
                </div>
            </div>
        </div>
    </div>

</div>
