<!DOCTYPE html>
<!-- style на самом <html> — не украшение, а самый ранний способ задать
     цвет: он применяется при разборе первых байтов страницы, до стилей и
     скриптов. Без него WebView успевает показать свой белый фон. -->
<html lang="ru" style="background-color: #000">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Свиночервь">
    <meta name="theme-color" content="#000000">
    <!-- Браузер до разбора страницы рисует свой «холст», и по умолчанию он
         СВЕТЛЫЙ — отсюда белая вспышка на тёмном сайте. color-scheme —
         единственный способ сказать про это заранее, ещё до стилей: холст
         становится тёмным. Мета-тег, а не только CSS, потому что читается
         он раньше всего остального. -->
    <meta name="color-scheme" content="dark">
    <!-- BUILD подставляется при деплое (.github/workflows/deploy-pages.yml).
         В репозитории всегда 'dev': значит файл открыт не с Pages. -->
    <meta name="app-build" content="__BUILD__">
    <meta name="app-branch" content="__BRANCH__">
    <title>Свиночервь Тамагочи</title>

    <!-- ================= ЭКРАН ЗАГРУЗКИ: КРИТИЧНАЯ ЧАСТЬ =================
         Стили и класс пелены лежат прямо здесь, а не в файлах, и это
         единственная причина, по которой они вообще написаны инлайном:
         всё, что подключается ссылкой, — это запрос в сеть ДО первого
         кадра. Пока такой запрос идёт, экран показывает не игру и не
         черноту, а белый фон вебвью. Именно так и получалась вспышка
         белым: сначала блокирующий <script>, потом восемь таблиц стилей,
         и только потом первый чёрный пиксель.

         Здесь запросов нет вообще: страница чернеет на первом же кадре.
         Логика (когда открывать, чего ждать) — в src/core/boot-screen.js,
         он подключён в конце <body> и первый кадр уже не задерживает. -->
    <style>
        /* То же самое, что мета-тег выше, но уже для стилей: тёмные
           умолчания браузера вместо светлых. */
        :root { color-scheme: dark; }

        html.boot-veil, html.boot-veil body { background: #000; }

        /* Игра обрезана в точку и не видна, но живёт: считает, строит HUD,
           рисует первый кадр персонажа — всё под чернотой. */
        html.boot-veil #game-container {
            -webkit-clip-path: circle(0% at 50% 50%);
            clip-path: circle(0% at 50% 50%);
        }

        /* Открытие: круг едет из центра до 150% — то есть заведомо за углы
           экрана. После анимации boot-screen.js снимает оба класса, и
           clip-path исчезает совсем: на мини-игры (они position:fixed
           внутри контейнера) обрезка не влияет. */
        html.boot-veil.boot-open #game-container {
            -webkit-clip-path: circle(150% at 50% 50%);
            clip-path: circle(150% at 50% 50%);
            -webkit-transition: -webkit-clip-path 1100ms cubic-bezier(0.22, 0.61, 0.36, 1);
            transition: clip-path 1100ms cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        /* Пульс включается с задержкой в 1.3 с: быстрый запуск остаётся
           просто чёрным, а долгое ожидание перестаёт выглядеть зависанием.
           Цвет — PALETTE.flesh[500], продублирован числом намеренно:
           палитра грузится позже, а пелена нужна с первого кадра. */
        html.boot-veil::after {
            content: '';
            position: fixed;
            left: 50%;
            top: 50%;
            width: 140px;
            height: 140px;
            margin: -70px 0 0 -70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167, 88, 99, 0.45) 0%, rgba(167, 88, 99, 0) 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 2147483646;
            animation: boot-veil-pulse 2.2s ease-in-out 1.3s infinite;
        }
        html.boot-veil.boot-open::after { animation: boot-veil-out 220ms linear forwards; }

        @keyframes boot-veil-pulse {
            0%, 100% { opacity: 0.12; transform: scale(0.85); }
            50%      { opacity: 0.55; transform: scale(1.08); }
        }
        @keyframes boot-veil-out { to { opacity: 0; } }

        /* Уход в чёрное перед перезагрузкой на новую сборку (см. boot.js):
           не моргаем, а гасим экран. */
        #boot-cover {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            opacity: 0;
            z-index: 2147483647;
            transition: opacity 300ms linear;
        }
        #boot-cover.on { opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            html.boot-veil.boot-open #game-container {
                -webkit-transition: -webkit-clip-path 200ms linear;
                transition: clip-path 200ms linear;
            }
            html.boot-veil::after { animation: none; }
        }
    </style>
    <script>
        // Класс ставится скриптом, а не написан в самом теге <html>,
        // сознательно: без JS пелену будет некому снять, и игра не
        // откроется вообще. Нет JS — нет и пелены, игра просто видна сразу.
        document.documentElement.classList.add('boot-veil');
        // Предохранитель на случай, если boot-screen.js не доехал или упал:
        // чёрный экран навсегда — это худший исход из всех возможных.
        window.__bootFailsafe = setTimeout(function () {
            document.documentElement.classList.remove('boot-veil', 'boot-open');
        }, 8000);

        // Отметка «экран стал чёрным». Ставится здесь, а не берётся из
        // performance-метрик браузера: те считают только ОСМЫСЛЕННУЮ
        // отрисовку, а под пеленой ничего осмысленного не видно, и число
        // получается про открытие игры, а не про черноту. Вложенный
        // requestAnimationFrame — это «после первого показанного кадра».
        // Видно в debug-режиме (кнопка 🐞), нужно для разбора вспышки
        // белым на запуске: доли миллисекунд здесь означают, что страница
        // ни при чём и белое показывает система до неё.
        window.__bootMarks = {};
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                window.__bootMarks.firstFrame = performance.now();
            });
        });
    </script>

    <!-- ВСЕ таблицы стилей подключены НЕ блокирующе, и это не
         микрооптимизация. Обычный <link rel="stylesheet"> запрещает браузеру
         рисовать что бы то ни было, пока не загрузится ПОСЛЕДНИЙ из них:
         восемь файлов, 92 КБ, восемь запросов — и всё это стоит перед первым
         же кадром, то есть перед чернотой экрана загрузки. Пока они едут,
         экран белый. Ровно это и оставалось от вспышки после того, как из
         критического пути убрали сеть.

         media="print" снимает блокировку (браузер считает файл ненужным для
         экрана и качает его спокойно), а onload возвращает media="all" —
         стили применяются, как только приехали.

         Позволить себе это можно только благодаря пелене: она чёрная от
         инлайн-стилей выше, ничего не требует и держится до window.load, то
         есть до момента, когда все эти файлы УЖЕ применены. Несобранного
         интерфейса игрок не увидит — он увидит черноту. -->
    <link rel="stylesheet" href="style.css?v=__BUILD__" media="print" onload="this.media='all'">
    <!-- Общее окно мини-игры (рамка, шапка, вопрос при выходе). Строго ДО
         стилей самих мини-игр: они настраивают его переменными. -->
    <link rel="stylesheet" href="src/core/minigame-window.css?v=__BUILD__" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="src/core/sins-menu.css?v=__BUILD__">

<body>

<!-- Просьба перевернуть телефон. Лежит СНАРУЖИ холста: холст масштабируется
     и центрируется, а это сообщение должно накрывать весь экран целиком. -->
<div id="rotate-overlay">
    <div class="rotate-inner">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Поверни телефон</div>
        <div class="rotate-sub">Свиночервь живёт вертикально</div>
    </div>
</div>

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <!-- Видно только в debug-режиме: по этой строке с телефона понятно,
         какая именно сборка сейчас открыта. -->
    <div id="build-stamp"></div>

    <!-- Кошелёк. Пока в нём только золото и добывать его негде — счётчик
         стоит, чтобы было куда начислять, когда появится первая добыча.
         Единственное, что осталось в комнате от интерфейса: шкалы грехов
         уехали в своё меню (src/core/sins-menu.js). -->
    <!-- data-cur на ВСЁМ чипе, а не на числе: по этой метке WalletFx находит
         счётчик и ставит вылетающую цифру рядом с ним. На одном числе цифра
         вставала бы поверх монеты слева от него. -->
    <!-- Метка data-cur теперь у каждой копилки, а не у всего кошелька: в нём
         рядом с золотом лежат жетоны грехов, и цифра должна вылетать из
         своей копилки. Жетоны дописывает GameManager.cacheElements. -->
    <div id="wallet">
        <span class="wallet-chip" data-cur="gold"><i class="coin-gold wallet-coin"></i><span id="wallet-gold">0</span></span>
    </div>

    <button id="debug-toggle-btn" class="debug-toggle-btn" title="Debug-режим">🐞</button>

    <!-- АЛЧНОСТЬ: ГАРАЖНЫЙ АППАРАТ.
         Рамки и крестика здесь нет: окно мини-игры одно на все грехи
         (src/core/minigame-window.js, инвариант 8). Сам аппарат — холсты,
         их ставит в #gj-stage greed.js (GreedJunkLit.mount): корпус на
         шейдере, рычаг, лоток, тряпка с комбинациями, монетоприёмник,
         градусник. Слов нет (инвариант 9; «WC» на монетоприёмнике — объявлено
         игроком). -->
    <div id="slots-game" class="minigame-screen">
        <div class="gj-stage" id="gj-stage"></div>
    </div>


    <!-- ГНЕВ. Рамки, заголовка и крестика здесь нет намеренно: окно мини-игры
         одно на все грехи и надевается сверху сборкой из
         src/core/minigame-window.js (см. docs/minigame-window.md).

         Внутри окна — два экрана греха: лобби и бой. Переключает их wrath.js,
         окно при этом не пересобирается (docs/plan/09-wrath-rework.md). -->
    <div id="wrath-game" class="minigame-screen mg-window" data-sin="wrath">

        <!-- ФОН. Один слой на все экраны: содержимое меняет маршрутизатор
             (WrathBackdrop). Лежит ПОД всем и пальцев не ловит — под ним
             кнопки и зоны ударов. Почему у каждого режима свой фон и почему
             он статический — в шапке src/minigames/wrath/wrath-backdrop.js. -->
        <div class="wrath-backdrop" id="wrath-backdrop" aria-hidden="true"></div>

        <!-- ЛОББИ: свиночервь, слоты снаряжения вокруг него, выбор режима.
             Слоты и кнопки режимов строятся из конфига
             (src/config/wrath-gear.js), поэтому здесь только контейнеры:
             слотов станет больше, и разметку под них дописывать не придётся. -->
        <!-- ОБЩАЯ ШАПКА ЛОББИ. Стоит НАД экранами, а не внутри лобби:
             здоровье, характеристики и кошелёк одинаковы в лобби, лавке,
             прокачке и на карте забега, и переключение экранов их не трогает.
             Меняется только то, что под шапкой.

             Раньше панель бойца жила внутри лобби, а кошелёк был размазан по
             кнопкам режимов: под значком лавки числом писались жетоны, под
             значком забега — цена входа. Кнопка при этом переставала быть
             кнопкой и становилась табло, а одни и те же числа приходилось
             искать в трёх разных местах.

             В бою шапка скрыта: там своё здоровье, и чужая полоса рядом с
             ним читалась бы как ещё один боец. -->
        <div class="wrath-head" id="wrath-head">
            <div class="wrath-panel" id="wrath-panel"></div>
        </div>

        <!-- ОБЩИЙ ПОДВАЛ. Пара к шапке: сверху — кто ты (здоровье, числа,
             кошелёк), снизу — куда пойти (режимы и лавка), между ними
             меняется только содержимое. Раньше режимы жили ВНУТРИ лобби, а у
             каждого меню была своя кнопка возврата в своём углу: из лавки в
             забег нельзя было попасть иначе как через лобби, и место кнопки
             «назад» переезжало от экрана к экрану.

             Кнопки «назад» здесь НЕТ, и это не упущение. Каждый режим —
             своё меню, и между меню ходят самими режимами: ряд внизу и есть
             навигация. Возврат был нужен, пока бой запускался прямо с кнопки
             и лобби было «домом», куда возвращаются; теперь бой запускается
             из своего меню, а лобби — это и есть меню боя. Лишняя кнопка,
             делающая то же, что кнопка рядом, только путает.

             В бою подвал скрыт вместе с шапкой: бой занимает весь экран и
             уходить из него посреди размена нельзя. -->
        <div class="wrath-foot" id="wrath-foot">
            <div class="wrath-modes" id="wrath-modes"></div>
        </div>

        <div class="wrath-screen active" id="wrath-lobby">
            <div class="wrath-gear">
                <div class="gear-column" id="wrath-gear-left"></div>

    <div id="lust-game" class="minigame-screen" data-sin="lust">
        <!-- ВСЯ СЦЕНА В ОДНОЙ ОБЁРТКЕ, и это ради переезда камеры.
             Наезд — это одно и то же преобразование, применённое ко всем
             холстам сразу. Раскладывать его покадрово по шести группам svg

             отдаётся композитору css-переходом на этой обёртке. Ни одной
             перерисовки: слои просто едут готовыми текстурами. В конце
             перехода обёртка сбрасывается, а настоящие числа камеры
             проставляются начисто — картинка снова резкая. -->
        <div id="bt-stage" class="bt-stage">
        <svg id="bt-back" class="bt-svg" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <!-- Комната и чаша: координаты сцены, по ней ездит камера. -->
            <g id="bt-cam-back"></g>
        </svg>
        <!-- ПОЛКА С МЫЛОМ И МОЧАЛКОЙ — четыре холста сразу за комнатой, в
             том же порядке, что слои этажерки: задняя часть (полноэкранная,

             поверх них — сетка корзины ПЕРЕД вещью.

             рисует (окно — BATH_SOAP.paint, BATH_CLOTH.paint), передняя сетка
             — размером с этажерку. Живая вещь (колба, волшебный флакон,
             конняку, облако) правит себя пятнадцать–тридцать раз в секунду, и
             пока она жила на полноэкранном холсте, каждая её правка на айфоне
             перерисовывала холст во весь экран: кадр 50–110 мс через кадр,
             вещь «тряслась» (docs/traps.md, п. 156). Слоем композитора
             (.bt-live) холст вещи становится ТОЛЬКО пока на нём живёт видимая
             живая вещь (bath-soap.js, layers): постоянный слой на айфоне —
             видеопамять, и в финале её нехватка роняла слои (п. 152).
             Порядок прежний: за потёками и за червём. -->
        <svg id="bt-shelf" class="bt-svg bt-quiet" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <g id="bt-cam-shelf"></g>
        </svg>
        <svg id="bt-soap-box" class="bt-svg bt-box bt-quiet" preserveAspectRatio="none"></svg>
        <svg id="bt-cloth-box" class="bt-svg bt-box bt-quiet" preserveAspectRatio="none"></svg>
        <svg id="bt-shelf-front" class="bt-svg bt-box bt-quiet" preserveAspectRatio="none"></svg>
        <!-- ПОТЁКИ НА СТЕНЕ — свой холст сразу за комнатой, а не группа в ней.
             Стена лежит ЗА червём, значит и то, что на неё прилипло, обязано
             прятаться за ним. Холст, а не svg: стена в расфокусе, и пятна на

             застывании (lust-goo.js). -->
        <canvas id="bt-goo-wall" class="bt-lather"></canvas>
        <!-- ДОЖДЬ ЖИВЁТ В СВОИХ ХОЛСТАХ, а не в группах комнаты, и это не
             вкусовщина, а самая дорогая правка кадра во всей ванной.

             Пока струйки лежали внутри общего svg и каждая ехала своей
             анимацией, каждый их кадр помечал грязной всю область экрана, и
             браузер перерисовывал ВСЮ комнату — две тысячи узлов — шестьдесят
             раз в секунду.

             Теперь узор дождя ПЕРИОДИЧЕН по вертикали и едет ЦЕЛИКОМ, одной
             анимацией на холст. Проехав ровно свой шаг, картинка совпадает
             сама с собой, и стыка не видно. Холст растрируется ОДИН РАЗ, а
             дальше видеокарта двигает готовую текстуру: ни отрисовки, ни

             Обёртка снаружи — НЕПОДВИЖНАЯ, и она обрезает верх. Обрезать
             изнутри нельзя: css-обрезка применяется до трансформации и
             поехала бы вместе с узором. Снизу обрезать нечего — там всё
             закрывает чаша.

             Холста два, потому что дождь и должен быть по обе стороны от
             червя: дальний — за ним, ближний — перед. -->
        <div id="bt-rain-far" class="bt-rain-clip">
            <svg class="bt-rain-move" viewBox="0 0 390 844"
                 preserveAspectRatio="xMidYMid slice">
                <g id="bt-cam-rain-far"></g>
            </svg>
        </div>
        <!-- Червь: общая моделька игрока, своего рисунка у ванной нет. -->
        <div id="bt-worm" class="bt-worm-host"></div>
        <!-- Состояние мытья: ОДИН холст на всё. Не два (муть отдельно, пена
             отдельно): пока они были разными слоями, «намылено» и «оттёрто»
             складывались в одно бледное пятно, и по картинке нельзя было
             понять, что уже сделано. Теперь у клетки одно состояние и один
             вид. Холст, а не фигуры в svg: след обязан обрезаться по силуэту
             червя, а сотни полупрозрачных пятен убивали кадры. -->
        <!-- Муть мыла и подложка пены мочалки — ОДНИМ СЛОЕМ, по пикселю на
             клетку карты роста (lust.js, filmLayer). Маленький холст,
             растянутый css: растягивает видеокарта при выводе, а шаг роста —
             одна запись 120×160 без пересборки холста мытья. Подложка пены
             смешивается поверх мути в самой картинке — холст один. -->
        <canvas id="bt-film" class="bt-lather bt-film"></canvas>
        <canvas id="bt-wash" class="bt-lather"></canvas>
        <!-- Блики пузырей: у каждого пузыря свой подвижный блик, ходит от

        <canvas id="bt-glint" class="bt-lather"></canvas>
        <div id="bt-rain-near" class="bt-rain-clip">
            <svg class="bt-rain-move" viewBox="0 0 390 844"
                 preserveAspectRatio="xMidYMid slice">
                <g id="bt-cam-rain-near"></g>
            </svg>

        <!-- ТРИ ХОЛСТА ВМЕСТО ОДНОГО, и делит их не порядок рисования, а

             им свой холст под чашей; струи и шкала тоже — им свой над.
             Между ними чаша, и она не меняется никогда, поэтому её и не
             перерисовывают.

             Пока всё лежало в одном холсте, каждое движение хвоста метило
             грязной область чаши, и запечённая чаша перерисовывалась
             шестьдесят раз в секунду. Замер (6× замедления, плотность 3):
             Paint 689 мс против 229, 45 кадров против 60. -->
        <svg id="bt-under" class="bt-svg bt-fast" viewBox="0 0 390 844"
             preserveAspectRatio="xMidYMid slice">
            <g id="bt-cam-under"></g>
        </svg>
        <!-- ГОРКА ПЕНЫ НАД ХВОСТОМ — холст между хвостом и чашей: пена
             накрывает хвост, а борт режет её снизу. Это та же пена, что на
             теле (тем же рисовальщиком), поэтому холст, а не svg; блики — на
             своём холсте поверх (lust.js, buildPile). -->
        <canvas id="bt-pile" class="bt-lather"></canvas>
        <canvas id="bt-pile-glint" class="bt-lather"></canvas>
