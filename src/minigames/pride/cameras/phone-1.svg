<svg xmlns="http://www.w3.org/2000/svg" viewBox="205 14.5 190 411" width="190" height="411">
  <!-- Смартфон №1: круглый остров камер — диск с хромовой кромкой, три объектива треугольником, вспышка. Графитовая стеклянная спинка, светлая рамка. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <linearGradient id="glassback" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a50"/><stop offset="0.5" stop-color="#2a2a2e"/><stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ph"><rect x="214" y="22" width="172" height="396" rx="38"/></clipPath>
</defs>
  <!-- боковые кнопки -->
  <rect x="384" y="130" width="8" height="54" rx="4" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="384" y="204" width="8" height="34" rx="4" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="208" y="150" width="8" height="64" rx="4" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <!-- рамка и стеклянная спинка -->
  <rect x="210" y="18" width="180" height="404" rx="42" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="215" y="23" width="170" height="394" rx="38" fill="url(#glassback)" stroke="#17171a" stroke-width="1.8"/>
  <g clip-path="url(#ph)"><path d="M215 23 L 385 23 L 215 330 Z" fill="url(#sweep)"/></g>
  <path d="M236 31 L 364 31" stroke="#fff" stroke-width="2.6" opacity="0.3" stroke-linecap="round"/>
  <!-- антенные разрезы -->
  <g stroke="#17171a" stroke-width="2.4" opacity="0.7" stroke-linecap="round"><path d="M215 62h10M375 62h10M215 372h10M375 372h10"/></g>
  <!-- круглый остров камер: диск с хромовой кромкой -->
  <circle cx="300" cy="116" r="76" fill="#0a0a0c" opacity="0.4" transform="translate(3 6)"/>
  <circle cx="300" cy="116" r="76" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="116" r="68" fill="url(#gloss)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="116" r="60" fill="none" stroke="#f2f2f2" stroke-width="1.2" opacity="0.28" stroke-dasharray="2 5"/>

  <circle cx="272" cy="98" r="26" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="272" cy="98" r="22.4" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="272" cy="98" r="18.2" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="272" cy="98" r="16.6" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="272" cy="98" r="14.6" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="272" cy="98" r="14.6" fill="url(#glassEdge)"/>
  <circle cx="272" cy="98" r="7.8" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="272" cy="98" r="2.6" fill="#050506" opacity="0.8"/>
  <path d="M262.1 93.8 C 264.2 87.1 270.7 84.0 277.2 85.0 C 271.5 87.1 267.3 90.2 265.2 97.0 Z" fill="url(#shine)"/>
  <circle cx="278.8" cy="105.3" r="2.3" fill="#fff" opacity="0.55"/>
  <circle cx="328" cy="98" r="26" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="328" cy="98" r="22.4" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="328" cy="98" r="18.2" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="328" cy="98" r="16.6" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="328" cy="98" r="14.6" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="328" cy="98" r="14.6" fill="url(#glassEdge)"/>
  <circle cx="328" cy="98" r="7.8" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="328" cy="98" r="2.6" fill="#050506" opacity="0.8"/>
  <path d="M318.1 93.8 C 320.2 87.1 326.7 84.0 333.2 85.0 C 327.5 87.1 323.3 90.2 321.2 97.0 Z" fill="url(#shine)"/>
  <circle cx="334.8" cy="105.3" r="2.3" fill="#fff" opacity="0.55"/>
  <circle cx="300" cy="148" r="26" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="148" r="22.4" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="300" cy="148" r="18.2" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="300" cy="148" r="16.6" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="300" cy="148" r="14.6" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="300" cy="148" r="14.6" fill="url(#glassEdge)"/>
  <circle cx="300" cy="148" r="7.8" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="148" r="2.6" fill="#050506" opacity="0.8"/>
  <path d="M290.1 143.8 C 292.2 137.1 298.7 134.0 305.2 135.0 C 299.5 137.1 295.3 140.2 293.2 147.0 Z" fill="url(#shine)"/>
  <circle cx="306.8" cy="155.3" r="2.3" fill="#fff" opacity="0.55"/>
  <!-- вспышка и датчик на острове -->
  <circle cx="346" cy="144" r="10" fill="#17171a" stroke="#17171a" stroke-width="1.6"/><circle cx="346" cy="144" r="6.4" fill="#e6e6ea"/><circle cx="344" cy="142" r="2" fill="#fff"/>
  <circle cx="252" cy="140" r="4" fill="#0a0a0c" stroke="#17171a" stroke-width="1"/><circle cx="251" cy="139" r="1.2" fill="#f2f2f2"/>
  <!-- пустая пластинка вместо знака -->
  <circle cx="300" cy="300" r="26" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.2"/>
  <circle cx="300" cy="300" r="14" fill="none" stroke="#f2f2f2" stroke-width="1.2" opacity="0.14"/>
</svg>
