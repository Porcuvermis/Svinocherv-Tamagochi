<svg xmlns="http://www.w3.org/2000/svg" viewBox="205 14.5 190 411" width="190" height="411">
  <!-- Смартфон №2: квадратный остров 2×2 (большой, средний и малый объективы + вспышка), верхняя треть глянцевая, ниже матовая часть; серебристая рамка. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <linearGradient id="matte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58585d"/><stop offset="0.5" stop-color="#3a3a3e"/><stop offset="1" stop-color="#26262a"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c6c72"/><stop offset="0.6" stop-color="#3a3a3f"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sat" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.5" fill="#fff" opacity="0.07"/></pattern>
    <clipPath id="ph"><rect x="214" y="22" width="172" height="396" rx="34"/></clipPath>
</defs>
  <!-- боковые кнопки: громкость и питание, серебро -->
  <rect x="384" y="120" width="8" height="46" rx="4" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="384" y="184" width="8" height="46" rx="4" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="208" y="150" width="8" height="26" rx="4" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <!-- рамка и спинка -->
  <rect x="210" y="18" width="180" height="404" rx="38" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="215" y="23" width="170" height="394" rx="34" fill="url(#matte)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="215" y="23" width="170" height="394" rx="34" fill="url(#sat)"/>
  <!-- верхняя треть — глянцевое стекло, ниже матовая часть -->
  <path d="M215 57 C 215 38 228 23 249 23 L 351 23 C 372 23 385 38 385 57 L 385 214 L 215 214 Z" fill="url(#glassTop)" stroke="#17171a" stroke-width="1.8"/>
  <path d="M215 214 L 385 214" stroke="#0a0a0c" stroke-width="3" opacity="0.7"/>
  <path d="M215 217 L 385 217" stroke="#fff" stroke-width="1.4" opacity="0.2"/>
  <g clip-path="url(#ph)"><path d="M215 23 L 385 23 L 215 214 Z" fill="url(#sweep)"/></g>
  <path d="M236 31 L 364 31" stroke="#fff" stroke-width="2.4" opacity="0.28" stroke-linecap="round"/>
  <!-- квадратный остров 2×2 -->
  <rect x="228" y="52" width="128" height="140" rx="30" fill="#0a0a0c" opacity="0.4" transform="translate(3 6)"/>
  <rect x="226" y="50" width="128" height="140" rx="30" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="232" y="56" width="116" height="128" rx="25" fill="url(#gloss)" stroke="#17171a" stroke-width="2"/>
  <path d="M250 63 L 330 63" stroke="#fff" stroke-width="2.2" opacity="0.22" stroke-linecap="round"/>

  <circle cx="268" cy="100" r="30" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="268" cy="100" r="25.8" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="268" cy="100" r="21.0" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="268" cy="100" r="19.2" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="268" cy="100" r="16.8" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="268" cy="100" r="16.8" fill="url(#glassEdge)"/>
  <circle cx="268" cy="100" r="9.0" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="268" cy="100" r="3.0" fill="#050506" opacity="0.8"/>
  <path d="M256.6 95.2 C 259.0 87.4 266.5 83.8 274.0 85.0 C 267.4 87.4 262.6 91.0 260.2 98.8 Z" fill="url(#shine)"/>
  <circle cx="275.8" cy="108.4" r="2.7" fill="#fff" opacity="0.55"/>
  <circle cx="322" cy="96" r="20" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="322" cy="96" r="17.2" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="322" cy="96" r="14.0" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="322" cy="96" r="12.8" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="322" cy="96" r="11.2" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="322" cy="96" r="11.2" fill="url(#glassEdge)"/>
  <circle cx="322" cy="96" r="6.0" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="322" cy="96" r="2.0" fill="#050506" opacity="0.8"/>
  <path d="M314.4 92.8 C 316.0 87.6 321.0 85.2 326.0 86.0 C 321.6 87.6 318.4 90.0 316.8 95.2 Z" fill="url(#shine)"/>
  <circle cx="327.2" cy="101.6" r="1.8" fill="#fff" opacity="0.55"/>
  <circle cx="268" cy="160" r="24" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="268" cy="160" r="20.6" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="268" cy="160" r="16.8" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="268" cy="160" r="15.4" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="268" cy="160" r="13.4" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="268" cy="160" r="13.4" fill="url(#glassEdge)"/>
  <circle cx="268" cy="160" r="7.2" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="268" cy="160" r="2.4" fill="#050506" opacity="0.8"/>
  <path d="M258.9 156.2 C 260.8 149.9 266.8 147.0 272.8 148.0 C 267.5 149.9 263.7 152.8 261.8 159.0 Z" fill="url(#shine)"/>
  <circle cx="274.2" cy="166.7" r="2.2" fill="#fff" opacity="0.55"/>
  <!-- вспышка и датчик в четвёртой клетке -->
  <circle cx="322" cy="152" r="16" fill="#17171a" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="322" cy="152" r="11" fill="#e6e6ea"/><circle cx="318" cy="148" r="3.2" fill="#fff"/>
  <circle cx="322" cy="124" r="3.2" fill="#0a0a0c"/><circle cx="321" cy="123" r="1" fill="#f2f2f2"/>
  <!-- нижняя часть: тонкая гравировка из линий и точек, без знака -->
  <g stroke="#f2f2f2" stroke-width="1.4" opacity="0.18" stroke-linecap="round"><path d="M262 330h76"/><path d="M276 342h48"/></g>
  <g fill="#f2f2f2" opacity="0.2"><circle cx="300" cy="300" r="2.4"/><circle cx="288" cy="300" r="2.4"/><circle cx="312" cy="300" r="2.4"/></g>
  <g stroke="#17171a" stroke-width="2.4" opacity="0.6" stroke-linecap="round"><path d="M215 372h10M375 372h10"/></g>
</svg>
