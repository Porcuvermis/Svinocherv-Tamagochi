<svg xmlns="http://www.w3.org/2000/svg" viewBox="62.5 62.5 489 325" width="489" height="325">
  <!-- Плёночная №4: моментальная камера — глянцевый чёрный корпус со скошенными плечами, горб-крышка, окно вспышки с сеткой, видоискатель, датчик, щель снимка, широкий раструб объектива. Чёрное, серые, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><path d="M112 98 C 90 98 76 114 73 142 L 66 330 C 64 362 82 384 114 384 L 486 384 C 518 384 536 362 534 330 L 527 142 C 524 114 510 98 488 98 Z"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c4c8"/><stop offset="1" stop-color="#7c7c82"/>
    </linearGradient>
    <pattern id="grid" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0h7M0 0v7" stroke="#17171a" stroke-width="1" opacity="0.28"/>
    </pattern>
</defs>
  <!-- ушко ремня справа -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#chrome)"><rect x="522" y="176" width="26" height="46" rx="10"/></g>
  <g fill="#17171a"><rect x="530" y="188" width="10" height="22" rx="5"/></g>

  <!-- спинка-горб сверху: крышка отсека кассеты -->
  <path d="M132 100 C 136 78 152 66 176 66 L 424 66 C 448 66 464 78 468 100 Z" fill="url(#gloss)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M148 94 C 152 82 162 76 178 76 L 422 76 C 438 76 448 82 452 94" fill="none" stroke="#fff" stroke-width="2.6" opacity="0.3" stroke-linecap="round"/>
  <g stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round" opacity="0.8"><path d="M270 84h60"/></g>

  <!-- корпус: глянцевый чёрный -->
  <path d="M112 98 C 90 98 76 114 73 142 L 66 330 C 64 362 82 384 114 384 L 486 384 C 518 384 536 362 534 330 L 527 142 C 524 114 510 98 488 98 Z" fill="url(#gloss)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <g clip-path="url(#bodyClip)">
    <!-- светлая полоса поперёк (единственная светлая зона) -->
    <rect x="60" y="168" width="480" height="16" fill="url(#stripe)" stroke="#17171a" stroke-width="1.8"/>
    <rect x="60" y="170" width="480" height="3" fill="#fff" opacity="0.6"/>
    <!-- блик вдоль левого плеча -->
    <path d="M86 150 L 80 320" stroke="#fff" stroke-width="3.4" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- видоискатель: окно слева -->
  <rect x="98" y="112" width="96" height="46" rx="10" fill="#0c0c0e" stroke="#17171a" stroke-width="2.2"/>
  <rect x="104" y="118" width="84" height="34" rx="7" fill="url(#glass)" stroke="#bdbdc2" stroke-width="1.2" opacity="0.95"/>
  <path d="M110 126 L 150 124" stroke="#fff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- датчик света -->
  <circle cx="226" cy="134" r="13" fill="#0c0c0e" stroke="#17171a" stroke-width="2"/>
  <circle cx="226" cy="134" r="8" fill="url(#glass)" stroke="#bdbdc2" stroke-width="1" opacity="0.9"/>
  <circle cx="223" cy="131" r="2.4" fill="#fff" opacity="0.8"/>
  <!-- вспышка: окно с частой сеткой справа, самая светлая деталь -->
  <rect x="340" y="108" width="162" height="56" rx="12" fill="#0c0c0e" stroke="#17171a" stroke-width="2.4"/>
  <rect x="348" y="116" width="146" height="40" rx="8" fill="#dcdce0" stroke="#17171a" stroke-width="1.8"/>
  <rect x="348" y="116" width="146" height="40" rx="8" fill="url(#grid)"/>
  <rect x="352" y="119" width="138" height="8" rx="4" fill="#fff" opacity="0.8"/>

  <!-- переключатель освещения слева: круг с лучами -->
  <circle cx="110" cy="214" r="14" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="110" cy="214" r="4.6" fill="none" stroke="#f2f2f2" stroke-width="1.8"/>
  <g stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round"><path d="M110 203v3M110 222v3M99 214h3M118 214h3M102 206l2 2M116 220l2 2M118 206l-2 2M104 220l-2 2"/></g>
  <!-- кнопка спуска: крупная, в кольце -->
  <ellipse cx="488" cy="262" rx="30" ry="26" fill="#17171a" opacity="0.4"/>
  <circle cx="486" cy="256" r="28" fill="url(#chrome)" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="486" cy="256" r="20" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/>
  <ellipse cx="482" cy="247" rx="12" ry="5" fill="#fff" opacity="0.35"/>
  <circle cx="486" cy="256" r="4.4" fill="#f2f2f2" opacity="0.9"/>

  <!-- выходная щель снимка -->
  <rect x="178" y="356" width="244" height="20" rx="8" fill="#0a0a0c" stroke="#17171a" stroke-width="2.2"/>
  <rect x="184" y="360" width="232" height="5" rx="2.5" fill="#2c2c30"/>
  <path d="M188 372 L 412 372" stroke="#fff" stroke-width="2" opacity="0.28" stroke-linecap="round"/>
  <g fill="#f2f2f2" opacity="0.85"><path d="M150 366l-10 -6v12z"/><path d="M450 366l10 -6v12z"/></g>

  <g transform="translate(0,-14)">
  <!-- ===== ОБЪЕКТИВ: центр (300, 262), широкий раструб ===== -->
  <circle cx="300" cy="262" r="106" fill="url(#gloss)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="262" r="106" fill="none" stroke="#fff" stroke-width="2.4" opacity="0.2"/>
  <circle cx="300" cy="262" r="96" fill="url(#chrome)" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="300" cy="262" r="90" fill="url(#barrel)" stroke="#17171a" stroke-width="2.2"/>
  <circle cx="300" cy="262" r="80" fill="none" stroke="#0a0a0c" stroke-width="14"/>
  <circle cx="300" cy="262" r="80" fill="none" stroke="#85858b" stroke-width="14" stroke-dasharray="2 3" opacity="0.7"/>
  <g stroke="#f2f2f2" stroke-width="2.2" stroke-linecap="round" opacity="0.92">
    <path d="M300 176v8"/><path d="M256 186l3 7"/><path d="M344 186l-3 7"/><path d="M222 214l5 6"/><path d="M378 214l-5 6"/><path d="M212 262h8"/><path d="M380 262h8"/>
  </g>
  <circle cx="300" cy="262" r="72" fill="none" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="300" cy="262" r="66" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="300" cy="262" r="59" fill="#0c0c0e" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="55" fill="none" stroke="#f2f2f2" stroke-width="2.4" opacity="0.88"/>
  <circle cx="300" cy="262" r="50" fill="url(#glass)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="262" r="50" fill="url(#glassEdge)"/>
  <circle cx="300" cy="262" r="34" fill="none" stroke="#c8c8cc" stroke-width="1.3" opacity="0.28"/>
  <circle cx="300" cy="262" r="18" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>
  <circle cx="300" cy="262" r="8" fill="#050506" stroke="#bdbdc2" stroke-width="1.1" opacity="0.7"/>
  <path d="M258 240 C 264 222 288 211 312 214 C 293 221 278 232 270 249 Z" fill="url(#shine)"/>
  <circle cx="332" cy="288" r="7.6" fill="#fff" opacity="0.5"/>
  <circle cx="322" cy="298" r="3.2" fill="#fff" opacity="0.75"/>
  </g>
</svg>
