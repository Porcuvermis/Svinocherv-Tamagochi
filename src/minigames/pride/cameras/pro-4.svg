<svg xmlns="http://www.w3.org/2000/svg" viewBox="24.5 43 551 338.5" width="551" height="338.5">
  <!-- Профессиональная №4: классическая гибридная — светлая верхняя панель, центральный горб, два диска, кольцо диафрагмы, окошко шкалы. Чёрное, серые, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="48" y="134" width="504" height="244" rx="20"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>
</defs>
  <!-- проушины-кольца -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#metal)">
    <rect x="28" y="158" width="24" height="44" rx="9"/><rect x="548" y="158" width="24" height="44" rx="9"/>
  </g>
  <g fill="#17171a"><rect x="35" y="170" width="10" height="20" rx="5"/><rect x="555" y="170" width="10" height="20" rx="5"/></g>

  <!-- горб видоискателя по центру: низкий, с тёмным стеклом -->
  <path d="M236 106 L 246 72 C 248 64 254 60 262 60 L 338 60 C 346 60 352 64 354 72 L 364 106 Z"
        fill="url(#plate)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M250 100 L 258 76 L 342 76 L 350 100" fill="none" stroke="#fff" stroke-width="2.2" opacity="0.2" stroke-linejoin="round"/>
  <rect x="268" y="82" width="64" height="16" rx="6" fill="#0b0b0d" stroke="#17171a" stroke-width="1.7"/>
  <rect x="274" y="85" width="26" height="4" rx="2" fill="#fff" opacity="0.28"/>
  <!-- башмак -->
  <rect x="262" y="46" width="76" height="16" rx="4" fill="url(#metal)" stroke="#17171a" stroke-width="1.7"/>
  <rect x="272" y="51" width="56" height="5" rx="2" fill="#17171a" opacity="0.6"/>

  <!-- верхняя панель: светлее корпуса, как у классики -->
  <path d="M50 142 C 50 112 64 98 90 98 L 510 98 C 536 98 550 112 550 142 Z"
        fill="url(#topmetal)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M70 108 L 226 108 M374 108 L 530 108" stroke="#fff" stroke-width="2.4" opacity="0.45" stroke-linecap="round"/>
  <!-- гравировка: тонкие белые линии и точки (без букв) -->
  <g stroke="#17171a" stroke-width="1.2" opacity="0.55" fill="none"><path d="M70 130h150M380 130h150"/></g>
  <g fill="#17171a" opacity="0.6"><circle cx="90" cy="120" r="1.6"/><circle cx="104" cy="120" r="1.6"/><circle cx="118" cy="120" r="1.6"/><circle cx="132" cy="120" r="1.6"/></g>

  <!-- диск режимов слева: рифлёный, с белым индексом -->
  <ellipse cx="124" cy="98" rx="48" ry="7" fill="#17171a" opacity="0.4"/>
  <rect x="78" y="68" width="92" height="32" rx="9" fill="url(#dark)" stroke="#17171a" stroke-width="2.2"/>
  <g stroke="#f2f2f2" stroke-width="1.8" opacity="0.82"><path d="M88 73v22M96 73v22M104 73v22M112 73v22M120 73v22M128 73v22M136 73v22M144 73v22M152 73v22M160 73v22"/></g>
  <rect x="82" y="71" width="84" height="5" rx="2.5" fill="#fff" opacity="0.2"/>
  <rect x="172" y="82" width="22" height="16" rx="5" fill="url(#metal)" stroke="#17171a" stroke-width="1.7"/>

  <!-- диск выдержки справа и спуск -->
  <ellipse cx="454" cy="98" rx="46" ry="7" fill="#17171a" opacity="0.4"/>
  <rect x="408" y="66" width="92" height="34" rx="9" fill="url(#dark)" stroke="#17171a" stroke-width="2.2"/>
  <g stroke="#f2f2f2" stroke-width="1.8" opacity="0.82"><path d="M418 71v24M426 71v24M434 71v24M442 71v24M450 71v24M458 71v24M466 71v24M474 71v24M482 71v24M490 71v24"/></g>
  <rect x="412" y="69" width="84" height="5" rx="2.5" fill="#fff" opacity="0.2"/>
  <circle cx="530" cy="88" r="14" fill="url(#metal)" stroke="#17171a" stroke-width="2.2"/>
  <circle cx="530" cy="88" r="8.5" fill="url(#dark)" stroke="#17171a" stroke-width="1.5"/>
  <ellipse cx="528" cy="85" rx="4.5" ry="2" fill="#fff" opacity="0.55"/>
  <!-- табло -->
  <rect x="256" y="112" width="88" height="20" rx="6" fill="#0b0b0d" stroke="#17171a" stroke-width="1.7"/>
  <g stroke="#f2f2f2" stroke-width="2.2" stroke-linecap="round"><path d="M266 122h12M284 122h6M296 122h14" opacity="0.9"/><path d="M322 122h14" opacity="0.5"/></g>

  <!-- корпус -->
  <rect x="48" y="134" width="504" height="244" rx="20" fill="url(#body)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="48" y="146" width="504" height="232" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <!-- строчка по периметру обтяжки -->
  <rect x="58" y="154" width="484" height="214" rx="14" fill="none" stroke="#9a9aa0" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.28"/>
  <path d="M58 142 L 542 142" stroke="#fff" stroke-width="2.4" opacity="0.2" stroke-linecap="round"/>
  <rect x="48" y="350" width="504" height="28" fill="#0a0a0c" opacity="0.28" clip-path="url(#bodyClip)"/>

  <!-- рукоятка слева: валик со строчкой -->
  <path d="M48 160 C 48 150 56 144 68 144 L 142 144 C 156 166 162 210 162 250 C 162 296 156 336 142 378 L 68 378 C 56 378 48 372 48 360 Z"
        fill="url(#grip)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M52 172 C 52 220 52 300 54 356" stroke="#fff" stroke-width="3" opacity="0.2" fill="none" stroke-linecap="round"/>
  <g clip-path="url(#bodyClip)"><rect x="60" y="226" width="102" height="140" fill="url(#stitch)"/></g>
  <!-- переднее колёсико под пальцем -->
  <ellipse cx="108" cy="188" rx="24" ry="13" fill="url(#dark)" stroke="#17171a" stroke-width="2"/>
  <g stroke="#f2f2f2" stroke-width="1.5" opacity="0.8"><path d="M92 183v10M98 181v14M104 180v16M110 180v16M116 181v14M122 183v10"/></g>
  <ellipse cx="108" cy="182" rx="16" ry="4" fill="#fff" opacity="0.18"/>
  <circle cx="140" cy="214" r="7" fill="#1a1a1d" stroke="#17171a" stroke-width="1.6"/><circle cx="138.4" cy="212.4" r="2.3" fill="#e8e8e8" opacity="0.85"/>

  <circle cx="512" cy="344" r="10" fill="url(#dark)" stroke="#17171a" stroke-width="1.7"/><circle cx="512" cy="344" r="3.4" fill="#f2f2f2" opacity="0.85"/>

  <!-- ===== ОБЪЕКТИВ: центр (300, 262) ===== -->
  <circle cx="300" cy="262" r="112" fill="url(#metal)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="262" r="104" fill="none" stroke="#17171a" stroke-width="1.2" opacity="0.5"/>
  <g fill="#17171a" opacity="0.8"><circle cx="300" cy="158" r="3.4"/><circle cx="210" cy="314" r="3.4"/><circle cx="390" cy="314" r="3.4"/></g>
  <!-- кнопка расстыковки -->
  <rect x="396" y="190" width="20" height="30" rx="8" fill="url(#dark)" stroke="#17171a" stroke-width="1.8" transform="rotate(34 406 205)"/>
  <circle cx="406" cy="205" r="3" fill="#f2f2f2" opacity="0.9"/>
  <!-- ствол -->
  <circle cx="300" cy="262" r="98" fill="url(#barrel)" stroke="#17171a" stroke-width="2.6"/>
  <!-- кольцо диафрагмы: крупная насечка -->
  <circle cx="300" cy="262" r="86" fill="none" stroke="#0a0a0c" stroke-width="18"/>
  <circle cx="300" cy="262" r="86" fill="none" stroke="#7c7c82" stroke-width="18" stroke-dasharray="5.2 7.1" opacity="0.72"/>
  <circle cx="300" cy="262" r="95" fill="none" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="77" fill="none" stroke="#17171a" stroke-width="1.7"/>
  <!-- шкала: окошко расстояний сверху с делениями, индекс-треугольник -->
  <path d="M300 172l-6 9h12z" fill="#f2f2f2"/>
  <g stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M214 262h9"/><path d="M377 262h9"/><path d="M240 204l6 6"/><path d="M360 204l-6 6"/><path d="M240 320l6 -6"/><path d="M360 320l-6 -6"/>
  </g>
  <!-- светлая оправа и стекло -->
  <circle cx="300" cy="262" r="70" fill="#0c0c0e" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="64" fill="none" stroke="#7a7a80" stroke-width="3" opacity="0.8"/>
  <circle cx="300" cy="262" r="58" fill="none" stroke="#f2f2f2" stroke-width="2.6" opacity="0.9"/>
  <circle cx="300" cy="262" r="53" fill="url(#glass)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="262" r="53" fill="url(#glassEdge)"/>
  <circle cx="300" cy="262" r="36" fill="none" stroke="#c8c8cc" stroke-width="1.3" opacity="0.28"/>
  <circle cx="300" cy="262" r="20" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>
  <path d="M300 250 l8 3.5 l3.5 8 l-3.5 8 l-8 3.5 l-8 -3.5 l-3.5 -8 l3.5 -8 z" fill="#050506" stroke="#bdbdc2" stroke-width="1.1" opacity="0.7"/>
  <path d="M256 238 C 262 218 286 207 310 210 C 290 217 274 229 266 247 Z" fill="url(#shine)"/>
  <circle cx="334" cy="290" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="323" cy="301" r="3.2" fill="#fff" opacity="0.75"/>
</svg>
