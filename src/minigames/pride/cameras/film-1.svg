<svg xmlns="http://www.w3.org/2000/svg" viewBox="26.5 47 547 332.5" width="547" height="332.5">
  <!-- Плёночная №1: классическая зеркалка — хромовая крыша, большая призма, головка перемотки, рычаг взвода, хромово-чёрный объектив. Чёрное, серые, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="52" y="140" width="496" height="236" rx="12"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>
</defs>
  <!-- проушины: треугольные ушки ремня -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#chrome)">
    <path d="M52 168 L 30 176 L 30 204 L 52 212 Z" stroke-linejoin="round"/><path d="M548 168 L 570 176 L 570 204 L 548 212 Z" stroke-linejoin="round"/>
  </g>
  <g fill="#17171a"><circle cx="40" cy="190" r="5"/><circle cx="560" cy="190" r="5"/></g>

  <!-- призма: крупная, скруглённая, с пустой пластинкой на лбу -->
  <path d="M176 142 C 180 98 214 66 262 64 L 338 64 C 386 66 420 98 424 142 Z"
        fill="url(#chromeV)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M196 138 C 202 106 228 82 266 80 L 334 80 C 372 82 398 106 404 138" fill="none" stroke="#fff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <rect x="268" y="96" width="64" height="24" rx="5" fill="#0e0e10" stroke="#17171a" stroke-width="1.8"/>
  <rect x="273" y="101" width="54" height="14" rx="3" fill="none" stroke="#f2f2f2" stroke-width="1.2" opacity="0.5"/>
  <g fill="#f2f2f2" opacity="0.8"><circle cx="286" cy="108" r="2"/><circle cx="300" cy="108" r="2"/><circle cx="314" cy="108" r="2"/></g>
  <!-- башмак -->
  <rect x="262" y="50" width="76" height="16" rx="4" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>
  <rect x="272" y="55" width="56" height="5" rx="2" fill="#17171a" opacity="0.6"/>

  <!-- верхняя панель: полированный хром -->
  <path d="M50 150 C 50 122 62 108 88 108 L 176 108 L 176 150 Z" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M424 108 L 512 108 C 538 108 550 122 550 150 L 424 150 Z" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M64 116 L 168 116 M436 116 L 536 116" stroke="#fff" stroke-width="2.6" opacity="0.7" stroke-linecap="round"/>

  <!-- перемотка слева: рифлёная головка со складной ручкой -->
  <g>
    <rect x="86" y="84" width="76" height="26" rx="8" fill="url(#chromeV)" stroke="#17171a" stroke-width="2.2"/>
    <g stroke="#17171a" stroke-width="1.4" opacity="0.55"><path d="M96 86v22M104 86v22M112 86v22M120 86v22M128 86v22M136 86v22M144 86v22M152 86v22"/></g>
    <rect x="90" y="87" width="68" height="5" rx="2.5" fill="#fff" opacity="0.6"/>
    <path d="M100 82 L 148 82" stroke="#17171a" stroke-width="7" stroke-linecap="round"/>
    <path d="M100 82 L 148 82" stroke="url(#chrome)" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="148" cy="82" r="4.6" fill="url(#dark)" stroke="#17171a" stroke-width="1.6"/>
  </g>
  <!-- диск выдержки справа и рычаг взвода -->
  <g>
    <rect x="438" y="84" width="64" height="28" rx="8" fill="url(#chromeV)" stroke="#17171a" stroke-width="2.2"/>
    <g stroke="#17171a" stroke-width="1.4" opacity="0.55"><path d="M448 86v24M456 86v24M464 86v24M472 86v24M480 86v24M488 86v24M496 86v24"/></g>
    <rect x="442" y="87" width="56" height="5" rx="2.5" fill="#fff" opacity="0.6"/>
    <rect x="456" y="76" width="22" height="8" rx="3" fill="#0e0e10" stroke="#17171a" stroke-width="1.4"/>
    <circle cx="467" cy="80" r="1.8" fill="#f2f2f2"/>
  </g>
  <g transform="translate(-2,-18)">
  <path d="M510 124 C 534 118 548 124 552 134 L 546 140 C 540 132 526 130 510 134 Z" fill="url(#chrome)" stroke="#17171a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="512" cy="129" r="6" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="512" cy="129" r="2.2" fill="#17171a" opacity="0.7"/>
  </g>
  <!-- спуск с резьбой под тросик -->
  <g>
    <ellipse cx="206" cy="112" rx="22" ry="6" fill="#17171a" opacity="0.4"/>
    <rect x="186" y="88" width="40" height="24" rx="9" fill="url(#chrome)" stroke="#17171a" stroke-width="2.2"/>
    <rect x="193" y="92" width="26" height="14" rx="6" fill="url(#dark)" stroke="#17171a" stroke-width="1.3"/>
    <ellipse cx="206" cy="95" rx="9" ry="2.6" fill="#fff" opacity="0.5"/>
  </g>
  <!-- индикатор счётчика кадров -->
  <rect x="352" y="116" width="62" height="20" rx="5" fill="#0e0e10" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="368" cy="126" r="5" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.9"/>
  <path d="M368 126l0 -4M380 126h20M380 121h12" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- корпус: чёрная обтяжка с мелким зерном -->
  <rect x="52" y="140" width="496" height="236" rx="12" fill="url(#body)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="52" y="150" width="496" height="226" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <path d="M64 146 L 536 146" stroke="#fff" stroke-width="2.2" opacity="0.2" stroke-linecap="round"/>
  <!-- хромовая окантовка нижней кромки -->
  <rect x="52" y="360" width="496" height="16" rx="8" fill="url(#chrome)" stroke="#17171a" stroke-width="2.2"/>
  <rect x="62" y="363" width="476" height="3.4" rx="1.7" fill="#fff" opacity="0.65"/>

  <!-- скошенные хромированные уголки -->
  <g fill="url(#chrome)" stroke="#17171a" stroke-width="1.8" stroke-linejoin="round">
    <path d="M52 150 L 52 186 L 78 150 Z"/><path d="M548 150 L 548 186 L 522 150 Z"/>
  </g>

  <!-- левая колодка: фактурная накладка с точечным упором -->
  <path d="M52 192 L 52 352 L 150 352 C 154 320 156 290 156 262 C 156 230 154 206 150 192 Z" fill="url(#grip)" stroke="#17171a" stroke-width="1.8" opacity="0.9"/>
  <g clip-path="url(#bodyClip)"><rect x="56" y="196" width="98" height="154" fill="url(#stitch)"/></g>
  <circle cx="126" cy="214" r="7.5" fill="url(#dark)" stroke="#17171a" stroke-width="1.7"/><circle cx="126" cy="214" r="2.8" fill="#f2f2f2" opacity="0.9"/>
  <!-- синхроконтакт справа внизу -->
  <circle cx="500" cy="318" r="12" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="500" cy="318" r="5.4" fill="#0e0e10"/>
  <circle cx="500" cy="318" r="2" fill="#f2f2f2" opacity="0.8"/>
  <!-- рычажок автоспуска у объектива -->
  <path d="M424 224 C 442 214 456 218 460 232 L 452 238 C 448 230 440 228 430 234 Z" fill="url(#chrome)" stroke="#17171a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="428" cy="232" r="6.4" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="428" cy="232" r="2.4" fill="#17171a" opacity="0.6"/>
  <!-- кнопка предпросмотра глубины резкости -->
  <circle cx="180" cy="318" r="10" fill="url(#dark)" stroke="#17171a" stroke-width="1.7"/><rect x="174" y="316" width="12" height="4" rx="2" fill="#f2f2f2" opacity="0.85"/>

  <!-- ===== ОБЪЕКТИВ: центр (300, 262), «сэндвич» хром + чёрный ===== -->
  <circle cx="300" cy="262" r="104" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="262" r="96" fill="none" stroke="#17171a" stroke-width="1.2" opacity="0.5"/>
  <g fill="#17171a" opacity="0.75"><circle cx="300" cy="166" r="3.4"/><circle cx="216" cy="310" r="3.4"/><circle cx="384" cy="310" r="3.4"/></g>
  <circle cx="300" cy="262" r="90" fill="url(#barrel)" stroke="#17171a" stroke-width="2.6"/>
  <!-- мелкая насечка кольца фокуса -->
  <circle cx="300" cy="262" r="80" fill="none" stroke="#0a0a0c" stroke-width="16"/>
  <circle cx="300" cy="262" r="80" fill="none" stroke="#85858b" stroke-width="16" stroke-dasharray="1.8 2.7" opacity="0.7"/>
  <circle cx="300" cy="262" r="88" fill="none" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="72" fill="none" stroke="#17171a" stroke-width="1.7"/>
  <!-- шкала расстояний: белые точки и риски по верхней дуге -->
  <g stroke="#f2f2f2" stroke-width="2.2" stroke-linecap="round" opacity="0.92">
    <path d="M300 178v8"/><path d="M270 182l2 8"/><path d="M330 182l-2 8"/><path d="M246 196l4 7"/><path d="M354 196l-4 7"/><path d="M228 218l6 5"/><path d="M372 218l-6 5"/>
  </g>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="285" cy="181" r="1.6"/><circle cx="315" cy="181" r="1.6"/></g>
  <!-- светлое кольцо диафрагмы -->
  <circle cx="300" cy="262" r="64" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="300" cy="262" r="58" fill="#0c0c0e" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="54" fill="none" stroke="#f2f2f2" stroke-width="2.4" opacity="0.88"/>
  <circle cx="300" cy="262" r="49" fill="url(#glass)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="262" r="49" fill="url(#glassEdge)"/>
  <circle cx="300" cy="262" r="33" fill="none" stroke="#c8c8cc" stroke-width="1.3" opacity="0.28"/>
  <circle cx="300" cy="262" r="18" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>
  <path d="M300 251 l7 3.2 l3.2 7 l-3.2 7 l-7 3.2 l-7 -3.2 l-3.2 -7 l3.2 -7 z" fill="#050506" stroke="#bdbdc2" stroke-width="1.1" opacity="0.7"/>
  <path d="M260 240 C 266 222 288 212 310 215 C 292 221 278 232 270 248 Z" fill="url(#shine)"/>
  <circle cx="330" cy="287" r="7.4" fill="#fff" opacity="0.5"/>
  <circle cx="320" cy="297" r="3" fill="#fff" opacity="0.75"/>
</svg>
