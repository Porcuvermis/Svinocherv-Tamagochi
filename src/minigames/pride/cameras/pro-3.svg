<svg xmlns="http://www.w3.org/2000/svg" viewBox="28.5 18.5 543 397" width="543" height="397">
  <!-- Профессиональная №3: флагман — высокий корпус с вертикальным хватом, выдвижная вспышка, мощный зум. Чёрное, серые, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="50" y="150" width="500" height="262" rx="24"/></clipPath>
  </defs>
  <!-- проушины -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#metal)">
    <rect x="32" y="178" width="22" height="42" rx="8"/><rect x="546" y="178" width="22" height="42" rx="8"/>
  </g>
  <g fill="#17171a"><rect x="38" y="190" width="9" height="18" rx="4.5"/><rect x="553" y="190" width="9" height="18" rx="4.5"/></g>

  <!-- выдвижная вспышка на призме: шарниры и головка с линзой Френеля -->
  <path d="M258 60 L 266 100 M342 60 L 334 100" stroke="#17171a" stroke-width="9" stroke-linecap="round"/>
  <path d="M258 60 L 266 100 M342 60 L 334 100" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
  <rect x="236" y="22" width="128" height="44" rx="12" fill="url(#plate)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="246" y="30" width="108" height="26" rx="7" fill="#d9d9dc" stroke="#17171a" stroke-width="1.7"/>
  <g stroke="#17171a" stroke-width="1.4" opacity="0.35">
    <path d="M258 31v24M268 31v24M278 31v24M288 31v24M298 31v24M308 31v24M318 31v24M328 31v24M338 31v24"/>
  </g>
  <rect x="250" y="33" width="100" height="6" rx="3" fill="#fff" opacity="0.7"/>

  <!-- призма: высокая, с прямыми плечами -->
  <path d="M188 160 L 204 104 C 208 94 216 90 228 90 L 372 90 C 384 90 392 94 396 104 L 412 160 Z"
        fill="url(#plate)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M210 150 L 222 108 L 378 108 L 390 150" fill="none" stroke="#fff" stroke-width="2.4" opacity="0.22" stroke-linejoin="round"/>
  <rect x="266" y="116" width="68" height="20" rx="6" fill="#0b0b0d" stroke="#17171a" stroke-width="1.7"/>
  <path d="M276 126h14M296 126h6M308 126h16" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- левое плечо: большой табло-экран -->
  <path d="M56 168 C 56 140 70 128 92 128 L 188 128 L 188 168 Z" fill="url(#plate)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="76" y="133" width="96" height="15" rx="6" fill="#0b0b0d" stroke="#17171a" stroke-width="1.8"/>
  <g stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round">
    <path d="M86 140h18M110 140h10" opacity="0.9"/><path d="M130 140h18" opacity="0.55"/>
  </g>
  <circle cx="160" cy="141" r="0.01" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.8"/>

  <!-- правое плечо: рифлёный диск и две кнопки -->
  <path d="M412 168 L 412 128 L 508 128 C 530 128 544 140 544 168 Z" fill="url(#plate)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="426" y="98" width="76" height="28" rx="8" fill="url(#dark)" stroke="#17171a" stroke-width="2"/>
  <g stroke="#f2f2f2" stroke-width="1.8" opacity="0.85"><path d="M436 102v20M444 102v20M452 102v20M460 102v20M468 102v20M476 102v20M484 102v20M492 102v20"/></g>
  <rect x="430" y="101" width="68" height="5" rx="2.5" fill="#fff" opacity="0.2"/>
  <g>
    <ellipse cx="450" cy="142" rx="16" ry="5" fill="#17171a" opacity="0.4"/>
    <rect x="432" y="130" width="36" height="17" rx="8.5" fill="url(#metal)" stroke="#17171a" stroke-width="2"/>
    <rect x="438" y="134" width="24" height="9" rx="4.5" fill="url(#dark)" stroke="#17171a" stroke-width="1.2"/>
  </g>
  <circle cx="500" cy="139" r="8" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/><circle cx="500" cy="139" r="3" fill="#f2f2f2" opacity="0.9"/>

  <!-- корпус: высокий, с вертикальным хватом внизу -->
  <rect x="50" y="150" width="500" height="262" rx="24" fill="url(#body)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="50" y="170" width="500" height="242" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <path d="M72 174 L 528 174" stroke="#fff" stroke-width="2.4" opacity="0.2" stroke-linecap="round"/>
  <!-- шов между корпусом и нижним хватом -->
  <path d="M50 352 L 550 352" stroke="#0a0a0c" stroke-width="4" opacity="0.7"/>
  <path d="M52 356 L 548 356" stroke="#fff" stroke-width="1.6" opacity="0.14"/>
  <rect x="50" y="356" width="500" height="56" fill="#0a0a0c" opacity="0.22" clip-path="url(#bodyClip)"/>
  <g clip-path="url(#bodyClip)" stroke="#0a0a0c" stroke-width="3" opacity="0.5">
    <path d="M60 372h90M60 384h90M60 396h90M450 372h90M450 384h90M450 396h90"/>
  </g>

  <!-- левый хват: валик -->
  <path d="M50 190 C 50 178 58 172 70 172 L 150 172 C 164 190 168 230 168 262 C 168 296 164 330 150 352 L 70 352 C 58 352 50 346 50 334 Z"
        fill="url(#grip)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M54 200 C 54 240 54 290 56 330" stroke="#fff" stroke-width="3" opacity="0.2" fill="none" stroke-linecap="round"/>
  <circle cx="118" cy="214" r="18" fill="url(#dark)" stroke="#17171a" stroke-width="2"/>
  <g stroke="#f2f2f2" stroke-width="1.6" opacity="0.8"><path d="M118 202v6M118 220v6M106 214h6M124 214h6"/></g>
  <circle cx="118" cy="214" r="4.6" fill="#f2f2f2" opacity="0.85"/>
  <circle cx="148" cy="192" r="6.5" fill="#1a1a1d" stroke="#17171a" stroke-width="1.6"/><circle cx="146.4" cy="190.4" r="2.2" fill="#e8e8e8" opacity="0.85"/>

  <!-- правый край: заглушки и вторая кнопка вертикального хвата -->
  <rect x="478" y="232" width="52" height="16" rx="8" fill="#161618" stroke="#17171a" stroke-width="1.7"/>
  <rect x="478" y="260" width="52" height="16" rx="8" fill="#161618" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="504" cy="386" r="14" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="504" cy="386" r="5" fill="#f2f2f2" opacity="0.85"/>
  <circle cx="96" cy="386" r="14" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/>
  <path d="M90 386h12" stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

  <!-- ===== ОБЪЕКТИВ: центр (300, 262), крупный зум ===== -->
  <ellipse cx="302" cy="372" rx="100" ry="8" fill="#0a0a0c" opacity="0.3"/>
  <circle cx="300" cy="262" r="114" fill="url(#metal)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="262" r="106" fill="none" stroke="#17171a" stroke-width="1.2" opacity="0.5"/>
  <g fill="#17171a" opacity="0.8"><circle cx="300" cy="156" r="3.4"/><circle cx="206" cy="316" r="3.4"/><circle cx="394" cy="316" r="3.4"/></g>
  <circle cx="300" cy="262" r="98" fill="url(#barrel)" stroke="#17171a" stroke-width="2.6"/>
  <!-- широкое кольцо зума с крупной рифлёнкой -->
  <circle cx="300" cy="262" r="86" fill="none" stroke="#0a0a0c" stroke-width="20"/>
  <circle cx="300" cy="262" r="86" fill="none" stroke="#77777c" stroke-width="20" stroke-dasharray="6 5" opacity="0.65"/>
  <circle cx="300" cy="262" r="96" fill="none" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="76" fill="none" stroke="#17171a" stroke-width="1.7"/>
  <!-- шкала на кольце: белые риски по дуге сверху -->
  <g stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round" opacity="0.92">
    <path d="M300 168v10"/><path d="M262 174l3 9"/><path d="M338 174l-3 9"/><path d="M230 192l6 8"/><path d="M370 192l-6 8"/>
  </g>
  <!-- тонкое белое кольцо -->
  <circle cx="300" cy="262" r="68" fill="none" stroke="#f2f2f2" stroke-width="3" opacity="0.9"/>
  <circle cx="300" cy="262" r="70.6" fill="none" stroke="#17171a" stroke-width="1.2"/>
  <circle cx="300" cy="262" r="65.4" fill="none" stroke="#17171a" stroke-width="1.2"/>
  <!-- вторая оправа и глубокий колодец -->
  <circle cx="300" cy="262" r="60" fill="#0c0c0e" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="262" r="54" fill="none" stroke="#7a7a80" stroke-width="3" opacity="0.75"/>
  <circle cx="300" cy="262" r="48" fill="url(#glass)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="262" r="48" fill="url(#glassEdge)"/>
  <circle cx="300" cy="262" r="32" fill="none" stroke="#c8c8cc" stroke-width="1.3" opacity="0.28"/>
  <circle cx="300" cy="262" r="17" fill="none" stroke="#c8c8cc" stroke-width="1.1" opacity="0.28"/>
  <!-- зрачок-отражение: восьмиугольник -->
  <path d="M300 250 l8 3.5 l3.5 8 l-3.5 8 l-8 3.5 l-8 -3.5 l-3.5 -8 l3.5 -8 z" fill="#050506" stroke="#bdbdc2" stroke-width="1.1" opacity="0.7"/>
  <path d="M260 240 C 266 222 288 212 310 215 C 292 221 278 232 270 249 Z" fill="url(#shine)"/>
  <circle cx="332" cy="288" r="7" fill="#fff" opacity="0.5"/>
  <circle cx="322" cy="297" r="3" fill="#fff" opacity="0.75"/>
</svg>
