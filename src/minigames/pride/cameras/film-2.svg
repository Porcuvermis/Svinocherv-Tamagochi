<svg xmlns="http://www.w3.org/2000/svg" viewBox="20.5 51 559 320.5" width="559" height="320.5">
  <!-- Плёночная №2: дальномерка — блок видоискателя и дальномера, светлые линованные накладки по бокам, затворный объектив. Чёрное, серые, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="40" y="124" width="520" height="244" rx="18"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <pattern id="rule" width="8" height="5" patternUnits="userSpaceOnUse">
      <rect x="0" y="3.4" width="8" height="1.2" fill="#2a2a2e" opacity="0.5"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6a6ab"/><stop offset="1" stop-color="#707075"/>
    </linearGradient>
</defs>
  <!-- проушины -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#chrome)">
    <rect x="24" y="162" width="24" height="44" rx="9"/><rect x="552" y="162" width="24" height="44" rx="9"/>
  </g>
  <g fill="#17171a"><rect x="31" y="174" width="10" height="20" rx="5"/><rect x="559" y="174" width="10" height="20" rx="5"/></g>

  <!-- верхняя панель: светлый металл -->
  <path d="M44 146 C 44 118 58 104 84 104 L 516 104 C 542 104 556 118 556 146 Z" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M62 112 L 238 112 M362 112 L 538 112" stroke="#fff" stroke-width="2.6" opacity="0.7" stroke-linecap="round"/>

  <!-- блок видоискателя и дальномера: широкий выступ по центру -->
  <path d="M216 108 L 222 78 C 224 70 230 66 238 66 L 362 66 C 370 66 376 70 378 78 L 384 108 Z"
        fill="url(#chromeV)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- окно видоискателя: большое, с отражением -->
  <rect x="246" y="74" width="62" height="28" rx="6" fill="url(#glass)" stroke="#17171a" stroke-width="2"/>
  <rect x="251" y="78" width="26" height="6" rx="3" fill="#fff" opacity="0.5"/>
  <circle cx="294" cy="94" r="2" fill="#fff" opacity="0.7"/>
  <!-- окно дальномера: малое круглое -->
  <circle cx="338" cy="88" r="14" fill="#0e0e10" stroke="#17171a" stroke-width="2"/>
  <circle cx="338" cy="88" r="9" fill="url(#glass)" stroke="#bdbdc2" stroke-width="1.2" opacity="0.9"/>
  <circle cx="334" cy="84" r="2.6" fill="#fff" opacity="0.8"/>
  <!-- башмак на блоке -->
  <rect x="274" y="54" width="52" height="14" rx="4" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>

  <!-- головка взвода справа: рифлёный круг -->
  <ellipse cx="478" cy="106" rx="42" ry="6" fill="#17171a" opacity="0.4"/>
  <rect x="438" y="78" width="80" height="30" rx="10" fill="url(#chromeV)" stroke="#17171a" stroke-width="2.2"/>
  <g stroke="#17171a" stroke-width="1.4" opacity="0.55"><path d="M448 81v24M456 81v24M464 81v24M472 81v24M480 81v24M488 81v24M496 81v24M504 81v24"/></g>
  <rect x="442" y="82" width="72" height="5" rx="2.5" fill="#fff" opacity="0.6"/>
  <!-- спуск слева на крыше -->
  <ellipse cx="124" cy="106" rx="26" ry="6" fill="#17171a" opacity="0.4"/>
  <rect x="98" y="82" width="52" height="26" rx="10" fill="url(#chrome)" stroke="#17171a" stroke-width="2.2"/>
  <rect x="106" y="87" width="36" height="16" rx="7" fill="url(#dark)" stroke="#17171a" stroke-width="1.4"/>
  <ellipse cx="124" cy="90" rx="12" ry="3" fill="#fff" opacity="0.5"/>
  <!-- малое колесо счётчика -->
  <rect x="158" y="92" width="24" height="16" rx="5" fill="url(#dark)" stroke="#17171a" stroke-width="1.6"/>
  <g stroke="#f2f2f2" stroke-width="1.4" opacity="0.8"><path d="M164 96v8M170 96v8M176 96v8"/></g>

  <!-- корпус: чёрная обтяжка -->
  <rect x="40" y="124" width="520" height="244" rx="18" fill="url(#body)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="40" y="136" width="520" height="232" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <path d="M60 130 L 540 130" stroke="#fff" stroke-width="2.2" opacity="0.2" stroke-linecap="round"/>
  <!-- нижняя хромовая планка -->
  <rect x="40" y="350" width="520" height="18" rx="9" fill="url(#chrome)" stroke="#17171a" stroke-width="2.2"/>
  <rect x="54" y="353" width="492" height="3.4" rx="1.7" fill="#fff" opacity="0.65"/>

  <!-- боковые накладки: светлые, с линовкой -->
  <g>
    <path d="M60 164 L 60 322 C 60 332 66 336 76 336 L 150 336 C 160 336 164 332 164 322 L 164 164 C 164 156 160 152 150 152 L 76 152 C 66 152 60 156 60 164 Z"
          fill="url(#panel)" stroke="#17171a" stroke-width="2.4"/>
    <rect x="66" y="158" width="92" height="172" rx="6" fill="url(#rule)" opacity="0.9"/>
    <path d="M68 160 L 156 160" stroke="#fff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <circle cx="74" cy="168" r="3.4" fill="#17171a" opacity="0.75"/><circle cx="150" cy="168" r="3.4" fill="#17171a" opacity="0.75"/>
    <circle cx="74" cy="320" r="3.4" fill="#17171a" opacity="0.75"/><circle cx="150" cy="320" r="3.4" fill="#17171a" opacity="0.75"/>
  </g>
  <g>
    <path d="M436 164 L 436 322 C 436 332 440 336 450 336 L 524 336 C 534 336 540 332 540 322 L 540 164 C 540 156 534 152 524 152 L 450 152 C 440 152 436 156 436 164 Z"
          fill="url(#panel)" stroke="#17171a" stroke-width="2.4"/>
    <rect x="442" y="158" width="92" height="172" rx="6" fill="url(#rule)" opacity="0.9"/>
    <path d="M444 160 L 532 160" stroke="#fff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <circle cx="450" cy="168" r="3.4" fill="#17171a" opacity="0.75"/><circle cx="526" cy="168" r="3.4" fill="#17171a" opacity="0.75"/>
    <circle cx="450" cy="320" r="3.4" fill="#17171a" opacity="0.75"/><circle cx="526" cy="320" r="3.4" fill="#17171a" opacity="0.75"/>
  </g>

  <!-- рамка вокруг объектива: тёмная фигурная плита -->
  <path d="M182 150 L 418 150 L 440 172 L 440 316 L 418 338 L 182 338 L 160 316 L 160 172 Z" fill="#1c1c1f" stroke="#17171a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M190 160 L 410 160 L 428 178 L 428 310 L 410 328 L 190 328 L 172 310 L 172 178 Z" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.14" stroke-linejoin="round"/>
  <!-- рычажок синхронизации у плиты и белая метка -->
  <circle cx="398" cy="166" r="8" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="398" cy="166" r="3" fill="#17171a" opacity="0.7"/>
  <rect x="190" y="162" width="24" height="9" rx="4.5" fill="#0e0e10" stroke="#17171a" stroke-width="1.4"/><circle cx="202" cy="166.5" r="2" fill="#f2f2f2"/>

  <!-- ===== ОБЪЕКТИВ: центр (300, 244), затвор кольцами ===== -->
  <circle cx="300" cy="244" r="100" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="244" r="92" fill="none" stroke="#17171a" stroke-width="1.2" opacity="0.5"/>
  <circle cx="300" cy="244" r="88" fill="url(#barrel)" stroke="#17171a" stroke-width="2.4"/>
  <!-- кольцо фокусировки с шкалой: белые риски и точки по всей окружности -->
  <circle cx="300" cy="244" r="78" fill="none" stroke="#0a0a0c" stroke-width="14"/>
  <g stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <path d="M300 160v8"/><path d="M258 168l3 7"/><path d="M342 168l-3 7"/><path d="M226 192l5 6"/><path d="M374 192l-5 6"/>
    <path d="M214 244h8"/><path d="M378 244h8"/><path d="M226 296l5 -6"/><path d="M374 296l-5 -6"/><path d="M258 320l3 -7"/><path d="M342 320l-3 -7"/><path d="M300 328v-8"/>
  </g>
  <g fill="#f2f2f2" opacity="0.8"><circle cx="279" cy="163" r="1.6"/><circle cx="321" cy="163" r="1.6"/><circle cx="241" cy="178" r="1.6"/><circle cx="359" cy="178" r="1.6"/></g>
  <circle cx="300" cy="244" r="85.5" fill="none" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="300" cy="244" r="70.5" fill="none" stroke="#17171a" stroke-width="1.6"/>
  <!-- светлое кольцо затвора с двумя винтами -->
  <circle cx="300" cy="244" r="64" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="300" cy="244" r="60" fill="none" stroke="#17171a" stroke-width="1" opacity="0.5"/>
  <g><circle cx="248" cy="244" r="4.4" fill="#17171a" opacity="0.8"/><path d="M245 244h6" stroke="#f2f2f2" stroke-width="1.2" opacity="0.7"/>
     <circle cx="352" cy="244" r="4.4" fill="#17171a" opacity="0.8"/><path d="M349 244h6" stroke="#f2f2f2" stroke-width="1.2" opacity="0.7"/></g>
  <circle cx="300" cy="244" r="52" fill="#0c0c0e" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="244" r="48" fill="none" stroke="#f2f2f2" stroke-width="2.4" opacity="0.88"/>
  <circle cx="300" cy="244" r="43" fill="url(#glass)" stroke="#17171a" stroke-width="2"/>
  <circle cx="300" cy="244" r="43" fill="url(#glassEdge)"/>
  <circle cx="300" cy="244" r="28" fill="none" stroke="#c8c8cc" stroke-width="1.3" opacity="0.28"/>
  <circle cx="300" cy="244" r="14" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>
  <path d="M300 235 l6 2.8 l2.8 6 l-2.8 6 l-6 2.8 l-6 -2.8 l-2.8 -6 l2.8 -6 z" fill="#050506" stroke="#bdbdc2" stroke-width="1.1" opacity="0.7"/>
  <path d="M265 227 C 270 211 290 202 310 205 C 293 211 280 221 273 236 Z" fill="url(#shine)"/>
  <circle cx="327" cy="268" r="6.4" fill="#fff" opacity="0.5"/>
  <circle cx="318" cy="277" r="2.8" fill="#fff" opacity="0.75"/>
</svg>
