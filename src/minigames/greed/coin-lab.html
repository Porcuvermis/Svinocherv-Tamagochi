<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>coin-lab</title>
<!-- ЛАБОРАТОРИЯ БЛИКА МОНЕТ (docs/plan/27-greed-skin.md, шаг 2). Не игра, слова разрешены.
     Двигай пальцем/мышью — это «наклон телефона»; на телефоне с датчиком
     блик следует за наклоном сам (после касания). Удалить, когда блик уйдёт в окно. -->
<style>
 html,body{margin:0;height:100%;background:#111;color:#ddd;font:12px sans-serif;overflow:hidden;touch-action:none}
 #stage{background:#4f3008;position:relative;width:390px;height:844px;margin:0 auto;transform-origin:top center;overflow:hidden}
 #stage canvas{position:absolute;left:0;top:0;width:390px;height:844px}
 #hud{position:fixed;left:6px;bottom:6px;background:#000a;padding:6px 8px;border-radius:6px;z-index:9;line-height:1.5}
 #hud input{width:110px;vertical-align:middle}
</style>
<div id="stage"></div>
<div id="hud">
 <div id="info"></div>
 <div>ширина° <input id="sig" type="range" min="5" max="30" step="1" value="13"></div>
 <div>чувствит. <input id="kk" type="range" min="0.1" max="1.2" step="0.05" value="0.45"></div>
 <div>яркость <input id="gain" type="range" min="0" max="1.5" step="0.05" value="1"></div>
 <div><label><input id="idle" type="checkbox"> сам качает (медленно)</label></div>
</div>
<script src="../../core/palette.js"></script>
<script src="../../core/tilt.js"></script>
<script src="greed-coins.js"></script>
<script>
(async () => {
    const G = GreedCoins, stage = document.getElementById('stage');
    const load = (u) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = u; });
    const [baseA, shineA] = await Promise.all([load('coins-base.png'), load('coins-shine.png')]);
    const fit = () => { const k = Math.min(innerWidth / 390, innerHeight / 844); stage.style.transform = 'scale(' + k + ')'; stage.style.left = '0'; stage.style.marginLeft = 'auto'; };
    fit(); addEventListener('resize', fit);
    const mk = () => { const c = document.createElement('canvas'); c.width = G.W; c.height = G.H; stage.appendChild(c); return c.getContext('2d'); };
    const t0 = performance.now(), layers = G.layout(), shineCtx = [];
    G.LAYERS.forEach((L, i) => { G.paintLayer(mk(), layers[i], L, baseA); shineCtx.push(mk()); });
    const buildMs = Math.round(performance.now() - t0);
    const info = document.getElementById('info'), q = (id) => document.getElementById(id);
    const tilt = { x: 0, y: 0 };
    let last = null, lit = 0, userAt = -1e9;
    function draw(force) {
        if (!force && last && Math.abs(last.x - tilt.x) < 0.008 && Math.abs(last.y - tilt.y) < 0.008) return;
        last = { x: tilt.x, y: tilt.y };
        G.SHINE.sigma = +q('sig').value; G.SHINE.K = +q('kk').value;
        const t = performance.now(); lit = 0;
        layers.forEach((c, i) => { lit += G.paintShine(shineCtx[i].canvas.getContext('2d'), c, G.LAYERS[i], shineA, tilt, +q('gain').value); });
        info.textContent = 'монет ' + layers.reduce((a, c) => a + c.length, 0) + ' · блестит ' + lit + ' · блик ' + (performance.now() - t).toFixed(1) + ' мс · куча ' + buildMs + ' мс · датчик ' + (Tilt.turn().live ? 'есть' : 'нет');
    }
    function setFromPointer(e) { tilt.x = Math.max(-1, Math.min(1, (e.clientX / innerWidth - 0.5) * 2)); tilt.y = Math.max(-1, Math.min(1, -(e.clientY / innerHeight - 0.5) * 2)); userAt = performance.now(); }
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) setFromPointer(e); });
    addEventListener('pointerdown', (e) => { setFromPointer(e); try { Tilt.ask && Tilt.ask(); } catch (_) {} });
    window.labSetTilt = (x, y) => { tilt.x = x; tilt.y = y; userAt = performance.now(); q('idle').checked = false; draw(true); return lit; };
    window.labLit = () => lit;
    (function loop(now) {
        const sensor = Tilt.turn();
        if (sensor.live) { tilt.x += (sensor.x - tilt.x) * 0.08; tilt.y += (sensor.y - tilt.y) * 0.08; }   // датчик дрожит — без сглаживания монеты мерцают
        else if (q('idle').checked && now - userAt > 2500) { tilt.x = 0.7 * Math.sin(now / 4500); tilt.y = 0.5 * Math.sin(now / 3100 + 1); }
        draw();
        requestAnimationFrame(loop);
    })(0);
})();
</script>
