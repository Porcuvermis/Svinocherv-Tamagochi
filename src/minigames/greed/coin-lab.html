<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>coin-lab</title>
<!-- ЛАБОРАТОРИЯ БЛИКА МОНЕТ (docs/plan/27-greed-skin.md, шаг 2). Не игра, слова разрешены.
     Свет — солнце над блюдом: наклон телефона поворачивает всю кучу разом.
     Двигай пальцем/мышью — это «наклон телефона»; на телефоне с датчиком
     блик следует за наклоном сам (после касания). Удалить, когда блик уйдёт в окно. -->
<style>
 html,body{margin:0;height:100%;background:#111;color:#ddd;font:12px sans-serif;overflow:hidden;touch-action:none}
 #stage{background:#4f3008;position:relative;width:390px;height:844px;margin:0 auto;transform-origin:top center;overflow:hidden}
 #stage canvas{position:absolute;left:0;top:0;width:390px;height:844px}
 #hud{position:fixed;left:6px;bottom:6px;background:#000a;padding:6px 8px;border-radius:6px;z-index:9;line-height:1.5}
 #hud input{width:110px;vertical-align:middle}
</style>
<div id="stage"></div>
<div id="hud">
 <div id="info"></div>
 <div>наклон блюда° <input id="tm" type="range" min="5" max="60" step="1" value="30"></div>
 <div>блеск <input id="sharp" type="range" min="0" max="3" step="0.05" value="1.3"></div>
 <div>резкость <input id="shin" type="range" min="10" max="200" step="5" value="60"></div>
 <div>отлив <input id="broad" type="range" min="0" max="1.5" step="0.05" value="0.35"></div>
 <div><label><input id="idle" type="checkbox"> сам качает (медленно)</label></div>
</div>
<script src="../../core/palette.js"></script>
<script src="../../core/tilt.js"></script>
<script src="greed-coins.js"></script>
<script>
(async () => {
    const G = GreedCoins, stage = document.getElementById('stage');
    const load = (u) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = u; });
    const [albA, norA] = await Promise.all([load('coins-albedo.png'), load('coins-normal.png')]);
    const fit = () => { const k = Math.min(innerWidth / 390, innerHeight / 844); stage.style.transform = 'scale(' + k + ')'; };
    fit(); addEventListener('resize', fit);
    const t0 = performance.now(), pile = G.buildPile(albA, norA);
    const buildMs = Math.round(performance.now() - t0);
    const cv = document.createElement('canvas'); cv.width = G.W; cv.height = G.H; stage.appendChild(cv);
    const draw = G.lighter(cv, pile);
    const info = document.getElementById('info'), q = (id) => document.getElementById(id);
    const tilt = { x: 0, y: 0 };
    let last = null, userAt = -1e9, dirty = true;
    document.querySelectorAll('#hud input').forEach(i => i.addEventListener('input', () => { dirty = true; }));
    function render() {
        if (!dirty && last && Math.abs(last.x - tilt.x) < 0.002 && Math.abs(last.y - tilt.y) < 0.002) return;
        last = { x: tilt.x, y: tilt.y }; dirty = false;
        Object.assign(G.LIGHT, { tiltMax: +q('tm').value, sharp: +q('sharp').value, shin: +q('shin').value, broad: +q('broad').value });
        draw(tilt);
        info.textContent = 'монет ' + pile.layers.reduce((a, c) => a + c.length, 0) + ' · куча ' + buildMs + ' мс · наклон ' + tilt.x.toFixed(2) + ' / ' + tilt.y.toFixed(2) + ' · датчик ' + (Tilt.turn().live ? 'есть' : 'нет');
    }
    // палец/мышь по пустому месту = наклон блюда (на телефоне без датчика)
    function setFromPointer(e) { tilt.x = Math.max(-1, Math.min(1, (e.clientX / innerWidth - 0.5) * 2)); tilt.y = Math.max(-1, Math.min(1, -(e.clientY / innerHeight - 0.5) * 2)); userAt = performance.now(); }
    stage.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) setFromPointer(e); });
    stage.addEventListener('pointerdown', (e) => { setFromPointer(e); try { Tilt.ask && Tilt.ask(); } catch (_) {} });
    window.labSetTilt = (x, y) => { tilt.x = x; tilt.y = y; userAt = performance.now(); q('idle').checked = false; dirty = true; render(); return 0; };
    (function loop(now) {
        const sensor = Tilt.turn();
        if (sensor.live && now - userAt > 1500) { tilt.x += (sensor.x - tilt.x) * 0.15; tilt.y += (sensor.y - tilt.y) * 0.15; }
        else if (q('idle').checked && now - userAt > 2500) { tilt.x = 0.7 * Math.sin(now / 4500); tilt.y = 0.5 * Math.sin(now / 3100 + 1); }
        render();
        requestAnimationFrame(loop);
    })(0);
})();
</script>
