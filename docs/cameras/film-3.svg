<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Плёночная №3: двухобъективная зеркалка — высокий корпус, два объектива друг над другом, закрытая шахта сверху, головки по бокам. Чёрное, серые, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="160" y="64" width="280" height="350" rx="18"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c5c61"/><stop offset="1" stop-color="#2e2e32"/>
    </linearGradient>
    <pattern id="rule" width="8" height="5" patternUnits="userSpaceOnUse">
      <rect x="0" y="3.4" width="8" height="1.2" fill="#2a2a2e" opacity="0.5"/>
    </pattern>
</defs>
  <!-- ремешок: две проушины сверху по бокам -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#chrome)">
    <rect x="144" y="92" width="24" height="42" rx="9"/><rect x="432" y="92" width="24" height="42" rx="9"/>
  </g>
  <g fill="#17171a"><rect x="151" y="103" width="10" height="20" rx="5"/><rect x="439" y="103" width="10" height="20" rx="5"/></g>

  <!-- закрытая шахта видоискателя: передняя створка с окошком-визиром -->
  <path d="M176 76 L 190 30 C 192 22 198 18 206 18 L 394 18 C 402 18 408 22 410 30 L 424 76 Z"
        fill="url(#chromeV)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M196 66 L 206 36 L 394 36 L 404 66" fill="none" stroke="#fff" stroke-width="2.4" opacity="0.5" stroke-linejoin="round"/>
  <rect x="268" y="34" width="64" height="26" rx="8" fill="#0e0e10" stroke="#17171a" stroke-width="1.8"/>
  <rect x="274" y="39" width="26" height="6" rx="3" fill="#fff" opacity="0.35"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="196" cy="50" r="2.4"/><circle cx="404" cy="50" r="2.4"/></g>

  <!-- корпус -->
  <rect x="160" y="64" width="280" height="350" rx="18" fill="url(#body)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="160" y="76" width="280" height="338" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <path d="M176 70 L 424 70" stroke="#fff" stroke-width="2.2" opacity="0.2" stroke-linecap="round"/>
  <rect x="160" y="396" width="280" height="18" rx="9" fill="url(#chrome)" stroke="#17171a" stroke-width="2.2"/>
  <rect x="172" y="399" width="256" height="3.4" rx="1.7" fill="#fff" opacity="0.65"/>

  <!-- светлая объективная плита -->
  <path d="M184 92 L 416 92 L 428 106 L 428 372 L 416 386 L 184 386 L 172 372 L 172 106 Z" fill="url(#panel)" stroke="#17171a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M192 100 L 408 100 L 420 112 L 420 366 L 408 378 L 192 378 L 180 366 L 180 112 Z" fill="url(#rule)" opacity="0.55" stroke-linejoin="round"/>
  <path d="M190 98 L 410 98" stroke="#fff" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  <g fill="#17171a" opacity="0.75"><circle cx="186" cy="106" r="3.2"/><circle cx="414" cy="106" r="3.2"/><circle cx="186" cy="372" r="3.2"/><circle cx="414" cy="372" r="3.2"/></g>

  <circle cx="300" cy="168" r="64" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="168" r="57" fill="none" stroke="#17171a" stroke-width="1.1" opacity="0.5"/>
  <circle cx="300" cy="168" r="56.32" fill="url(#barrel)" stroke="#17171a" stroke-width="2.2"/>
  <circle cx="300" cy="168" r="52.480000000000004" fill="none" stroke="#0a0a0c" stroke-width="7.68"/>
  <circle cx="300" cy="168" r="52.480000000000004" fill="none" stroke="#85858b" stroke-width="7.68" stroke-dasharray="1.8 2.7" opacity="0.7"/>
  <circle cx="300" cy="168" r="48.64" fill="none" stroke="#17171a" stroke-width="1.6"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="300" cy="115.5" r="2.2"/><circle cx="247.5" cy="168" r="1.8"/><circle cx="352.5" cy="168" r="1.8"/></g>
  <circle cx="300" cy="168" r="39.68" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="168" r="33.28" fill="#0c0c0e" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="300" cy="168" r="29.78" fill="none" stroke="#f2f2f2" stroke-width="2.2" opacity="0.88"/>
  <circle cx="300" cy="168" r="28.16" fill="url(#glass)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="300" cy="168" r="28.16" fill="url(#glassEdge)"/>
  <circle cx="300" cy="168" r="17.5" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>

  <path d="M282.5 160.1 C 285.9 148.3 297.2 142.7 308.4 143.8 C 298.6 148.3 291.6 153.9 288.2 165.2 Z" fill="url(#shine)"/>
  <circle cx="311.8" cy="180.7" r="4.2" fill="#fff" opacity="0.5"/>
  <circle cx="307.9" cy="184.9" r="2.0" fill="#fff" opacity="0.75"/>
  <!-- перемычка между объективами: пустая планка с белыми точками -->
  <rect x="254" y="238" width="92" height="22" rx="6" fill="#0e0e10" stroke="#17171a" stroke-width="1.8"/>
  <rect x="259" y="243" width="82" height="12" rx="3" fill="none" stroke="#f2f2f2" stroke-width="1.1" opacity="0.5"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="278" cy="249" r="2"/><circle cx="300" cy="249" r="2"/><circle cx="322" cy="249" r="2"/></g>

  <circle cx="300" cy="322" r="64" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="300" cy="322" r="57" fill="none" stroke="#17171a" stroke-width="1.1" opacity="0.5"/>
  <circle cx="300" cy="322" r="56.32" fill="url(#barrel)" stroke="#17171a" stroke-width="2.2"/>
  <circle cx="300" cy="322" r="52.480000000000004" fill="none" stroke="#0a0a0c" stroke-width="7.68"/>
  <circle cx="300" cy="322" r="52.480000000000004" fill="none" stroke="#85858b" stroke-width="7.68" stroke-dasharray="1.8 2.7" opacity="0.7"/>
  <circle cx="300" cy="322" r="48.64" fill="none" stroke="#17171a" stroke-width="1.6"/>
  <g stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" opacity="0.92"><path d="M300.0 270.8v6" transform="rotate(0 300 322)"/><path d="M300.0 270.8v6" transform="rotate(-24 300 322)"/><path d="M300.0 270.8v6" transform="rotate(24 300 322)"/><path d="M300.0 270.8v6" transform="rotate(-48 300 322)"/><path d="M300.0 270.8v6" transform="rotate(48 300 322)"/><path d="M300.0 270.8v6" transform="rotate(-72 300 322)"/><path d="M300.0 270.8v6" transform="rotate(72 300 322)"/><path d="M300.0 270.8v6" transform="rotate(180 300 322)"/><path d="M300.0 270.8v6" transform="rotate(-156 300 322)"/><path d="M300.0 270.8v6" transform="rotate(156 300 322)"/></g>
  <circle cx="300" cy="322" r="39.68" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="300" cy="322" r="33.28" fill="#0c0c0e" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="300" cy="322" r="29.78" fill="none" stroke="#f2f2f2" stroke-width="2.2" opacity="0.88"/>
  <circle cx="300" cy="322" r="28.16" fill="url(#glass)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="300" cy="322" r="28.16" fill="url(#glassEdge)"/>
  <circle cx="300" cy="322" r="17.5" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>

  <path d="M282.5 314.1 C 285.9 302.3 297.2 296.7 308.4 297.8 C 298.6 302.3 291.6 307.9 288.2 319.2 Z" fill="url(#shine)"/>
  <circle cx="311.8" cy="334.7" r="4.2" fill="#fff" opacity="0.5"/>
  <circle cx="307.9" cy="338.9" r="2.0" fill="#fff" opacity="0.75"/>
  <!-- спуск слева и рычаг автоспуска справа -->
  <circle cx="204" cy="342" r="11" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="204" cy="342" r="5" fill="url(#dark)" stroke="#17171a" stroke-width="1.2"/>
  <circle cx="396" cy="342" r="9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="396" cy="342" r="3.2" fill="#17171a" opacity="0.65"/>
  <path d="M396 342 C 410 336 418 330 418 318" stroke="#17171a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M396 342 C 410 336 418 330 418 318" stroke="url(#chrome)" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <circle cx="204" cy="140" r="6" fill="url(#dark)" stroke="#17171a" stroke-width="1.6"/><circle cx="204" cy="140" r="2.2" fill="#f2f2f2"/>

  <!-- боковые головки (вид с торца): фокусировка слева, взвод справа -->
  <g>
    <rect x="128" y="196" width="36" height="86" rx="14" fill="url(#chromeV)" stroke="#17171a" stroke-width="2.4"/>
    <g stroke="#17171a" stroke-width="1.4" opacity="0.55"><path d="M132 206h28M132 214h28M132 222h28M132 230h28M132 238h28M132 246h28M132 254h28M132 262h28M132 270h28"/></g>
    <rect x="132" y="199" width="28" height="6" rx="3" fill="#fff" opacity="0.5"/>
  </g>
  <g>
    <rect x="436" y="196" width="36" height="86" rx="14" fill="url(#chromeV)" stroke="#17171a" stroke-width="2.4"/>
    <g stroke="#17171a" stroke-width="1.4" opacity="0.55"><path d="M440 206h28M440 214h28M440 222h28M440 230h28M440 238h28M440 246h28M440 254h28M440 262h28M440 270h28"/></g>
    <rect x="440" y="199" width="28" height="6" rx="3" fill="#fff" opacity="0.5"/>
    <!-- складная ручка взвода -->
    <path d="M472 240 L 500 240" stroke="#17171a" stroke-width="9" stroke-linecap="round"/>
    <path d="M472 240 L 500 240" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="502" cy="240" r="6" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/><circle cx="502" cy="240" r="2" fill="#f2f2f2" opacity="0.85"/>
  </g>
</svg>
