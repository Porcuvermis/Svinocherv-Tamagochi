<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Смартфон №3 (в духе яблочного): квадратный глянцевый остров с тремя объективами треугольником, вспышкой и датчиком глубины, матовая светло-серая спинка, полированная стальная рамка, кнопки слева и справа. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d8dd"/><stop offset="0.55" stop-color="#b8b8be"/><stop offset="1" stop-color="#9c9ca3"/>
    </linearGradient>
    <linearGradient id="islandg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e6ea"/><stop offset="1" stop-color="#b0b0b8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sat" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.5" fill="#17171a" opacity="0.07"/></pattern>
    <clipPath id="ph"><rect x="215" y="23" width="170" height="394" rx="34"/></clipPath>
</defs>
  <!-- боковые кнопки: слева переключатель и две качалки, справа питание -->
  <rect x="207" y="110" width="8" height="22" rx="3.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="207" y="150" width="8" height="44" rx="3.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="207" y="206" width="8" height="44" rx="3.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="385" y="170" width="8" height="74" rx="3.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <!-- полированная стальная рамка и матовая стеклянная спинка -->
  <rect x="210" y="18" width="180" height="404" rx="40" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="215" y="23" width="170" height="394" rx="35" fill="url(#frost)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="215" y="23" width="170" height="394" rx="35" fill="url(#sat)"/>
  <g clip-path="url(#ph)"><path d="M215 23 L 385 23 L 215 250 Z" fill="url(#sweep)"/></g>
  <!-- антенные разрезы -->
  <g stroke="#17171a" stroke-width="2.2" opacity="0.35" stroke-linecap="round"><path d="M215 64h12M373 64h12M215 372h12M373 372h12"/></g>
  <!-- квадратный остров: глянцевое стекло со скруглёнными углами -->
  <rect x="228" y="46" width="100" height="100" rx="24" fill="#17171a" opacity="0.28" transform="translate(3 6)"/>
  <rect x="226" y="44" width="100" height="100" rx="24" fill="url(#islandg)" stroke="#17171a" stroke-width="2.4"/>
  <rect x="231" y="49" width="90" height="90" rx="20" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <circle cx="256" cy="78" r="23" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="256" cy="78" r="19.8" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="256" cy="78" r="16.1" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="78" r="14.7" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="256" cy="78" r="12.9" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="78" r="12.9" fill="url(#glassEdge)"/>
  <circle cx="256" cy="78" r="6.9" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="78" r="2.3" fill="#050506" opacity="0.8"/>
  <path d="M247.3 74.3 C 249.1 68.3 254.8 65.6 260.6 66.5 C 255.5 68.3 251.9 71.1 250.0 77.1 Z" fill="url(#shine)"/>
  <circle cx="262.0" cy="84.4" r="2.1" fill="#fff" opacity="0.55"/>
  <circle cx="256" cy="122" r="23" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="256" cy="122" r="19.8" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="256" cy="122" r="16.1" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="122" r="14.7" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="256" cy="122" r="12.9" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="122" r="12.9" fill="url(#glassEdge)"/>
  <circle cx="256" cy="122" r="6.9" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="122" r="2.3" fill="#050506" opacity="0.8"/>
  <path d="M247.3 118.3 C 249.1 112.3 254.8 109.6 260.6 110.5 C 255.5 112.3 251.9 115.1 250.0 121.1 Z" fill="url(#shine)"/>
  <circle cx="262.0" cy="128.4" r="2.1" fill="#fff" opacity="0.55"/>
  <circle cx="302" cy="100" r="23" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="302" cy="100" r="19.8" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="302" cy="100" r="16.1" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="302" cy="100" r="14.7" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="302" cy="100" r="12.9" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="302" cy="100" r="12.9" fill="url(#glassEdge)"/>
  <circle cx="302" cy="100" r="6.9" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="302" cy="100" r="2.3" fill="#050506" opacity="0.8"/>
  <path d="M293.3 96.3 C 295.1 90.3 300.9 87.6 306.6 88.5 C 301.5 90.3 297.9 93.1 296.0 99.1 Z" fill="url(#shine)"/>
  <circle cx="308.0" cy="106.4" r="2.1" fill="#fff" opacity="0.55"/>
  <!-- вспышка, датчик глубины, микрофон -->
  <circle cx="302" cy="64" r="8" fill="#17171a" stroke="#17171a" stroke-width="1.4"/><circle cx="302" cy="64" r="5.4" fill="#f0f0f4"/><circle cx="300.4" cy="62.4" r="1.8" fill="#fff"/>
  <circle cx="302" cy="132" r="7.5" fill="#101012" stroke="#17171a" stroke-width="1.4"/><circle cx="300.6" cy="130.6" r="1.6" fill="#8a8a92"/>
  <circle cx="318" cy="128" r="2.2" fill="#17171a" opacity="0.8"/>
  <!-- на спинке посредине — пустая светлая плашка вместо знака (знака нет) -->
  <circle cx="300" cy="258" r="30" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <circle cx="300" cy="258" r="30" fill="none" stroke="#17171a" stroke-width="1" opacity="0.18" transform="translate(0.8 0.8)"/>
</svg>
