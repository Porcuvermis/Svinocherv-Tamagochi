<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Смартфон №3: вертикальная колонка из трёх объективов в хромовой капсуле и кольцевая вспышка из восьми светодиодов; плоская брусковая рамка, графитовая спинка с тонкой штриховкой. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46464b"/><stop offset="0.5" stop-color="#2b2b2f"/><stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
    <pattern id="hb" width="4" height="4" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="4" height="1" fill="#fff" opacity="0.06"/></pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ph"><rect x="216" y="24" width="168" height="392" rx="17"/></clipPath>
</defs>
  <!-- боковые кнопки -->
  <rect x="388" y="150" width="8" height="40" rx="3" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="388" y="206" width="8" height="40" rx="3" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="388" y="276" width="8" height="22" rx="3" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/><circle cx="392" cy="287" r="2" fill="#f2f2f2"/>
  <!-- плоская «брусковая» рамка и спинка -->
  <rect x="210" y="18" width="180" height="404" rx="22" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="216" y="24" width="168" height="392" rx="17" fill="url(#slab)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="216" y="24" width="168" height="392" rx="17" fill="url(#hb)"/>
  <g clip-path="url(#ph)"><path d="M216 24 L 384 24 L 216 300 Z" fill="url(#sweep)"/></g>
  <path d="M228 33 L 372 33" stroke="#fff" stroke-width="2.4" opacity="0.28" stroke-linecap="round"/>
  <!-- антенные полосы -->
  <g fill="#0a0a0c" opacity="0.8"><rect x="216" y="368" width="168" height="5"/><rect x="216" y="56" width="0" height="0"/></g>
  <path d="M216 375 L 384 375" stroke="#fff" stroke-width="1.2" opacity="0.18"/>
  <!-- вертикальная колонка из трёх объективов -->
  <rect x="226" y="48" width="64" height="162" rx="32" fill="#0a0a0c" opacity="0.4" transform="translate(3 6)"/>
  <rect x="224" y="46" width="64" height="162" rx="32" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="229" y="51" width="54" height="152" rx="27" fill="url(#gloss)" stroke="#17171a" stroke-width="2"/>

  <circle cx="256" cy="82" r="22" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="256" cy="82" r="18.9" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="256" cy="82" r="15.4" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="82" r="14.1" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="256" cy="82" r="12.3" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="82" r="12.3" fill="url(#glassEdge)"/>
  <circle cx="256" cy="82" r="6.6" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="82" r="2.2" fill="#050506" opacity="0.8"/>
  <path d="M247.6 78.5 C 249.4 72.8 254.9 70.1 260.4 71.0 C 255.6 72.8 252.0 75.4 250.3 81.1 Z" fill="url(#shine)"/>
  <circle cx="261.7" cy="88.2" r="2.0" fill="#fff" opacity="0.55"/>
  <circle cx="256" cy="130" r="22" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="256" cy="130" r="18.9" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="256" cy="130" r="15.4" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="130" r="14.1" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="256" cy="130" r="12.3" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="130" r="12.3" fill="url(#glassEdge)"/>
  <circle cx="256" cy="130" r="6.6" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="130" r="2.2" fill="#050506" opacity="0.8"/>
  <path d="M247.6 126.5 C 249.4 120.8 254.9 118.1 260.4 119.0 C 255.6 120.8 252.0 123.4 250.3 129.1 Z" fill="url(#shine)"/>
  <circle cx="261.7" cy="136.2" r="2.0" fill="#fff" opacity="0.55"/>
  <circle cx="256" cy="176" r="17" fill="url(#chrome)" stroke="#17171a" stroke-width="2"/>
  <circle cx="256" cy="176" r="14.6" fill="url(#barrel)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="256" cy="176" r="11.9" fill="#0c0c0e" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="176" r="10.9" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.85"/>
  <circle cx="256" cy="176" r="9.5" fill="url(#glass)" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="256" cy="176" r="9.5" fill="url(#glassEdge)"/>
  <circle cx="256" cy="176" r="5.1" fill="none" stroke="#c8c8cc" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="176" r="1.7" fill="#050506" opacity="0.8"/>
  <path d="M249.5 173.3 C 250.9 168.9 255.2 166.8 259.4 167.5 C 255.7 168.9 252.9 170.9 251.6 175.3 Z" fill="url(#shine)"/>
  <circle cx="260.4" cy="180.8" r="1.5" fill="#fff" opacity="0.55"/>
  <!-- кольцевая вспышка: восемь светодиодов вокруг тёмного стекла -->
  <circle cx="338" cy="94" r="34" fill="#0a0a0c" opacity="0.4" transform="translate(3 5)"/>
  <circle cx="336" cy="92" r="34" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="336" cy="92" r="28" fill="url(#gloss)" stroke="#17171a" stroke-width="2"/>
  <circle cx="353.6" cy="99.3" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="352.6" cy="98.3" r="1.4" fill="#fff"/>
  <circle cx="343.3" cy="109.6" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="342.3" cy="108.6" r="1.4" fill="#fff"/>
  <circle cx="328.7" cy="109.6" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="327.7" cy="108.6" r="1.4" fill="#fff"/>
  <circle cx="318.4" cy="99.3" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="317.4" cy="98.3" r="1.4" fill="#fff"/>
  <circle cx="318.4" cy="84.7" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="317.4" cy="83.7" r="1.4" fill="#fff"/>
  <circle cx="328.7" cy="74.4" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="327.7" cy="73.4" r="1.4" fill="#fff"/>
  <circle cx="343.3" cy="74.4" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="342.3" cy="73.4" r="1.4" fill="#fff"/>
  <circle cx="353.6" cy="84.7" r="4.6" fill="#eeeef2" stroke="#17171a" stroke-width="1.2"/><circle cx="352.6" cy="83.7" r="1.4" fill="#fff"/>

  <circle cx="336" cy="92" r="10" fill="#0c0c0e" stroke="#17171a" stroke-width="1.6"/><circle cx="336" cy="92" r="5" fill="url(#glass)"/><circle cx="334" cy="90" r="1.6" fill="#fff" opacity="0.85"/>
  <!-- датчик и микрофон под вспышкой -->
  <circle cx="336" cy="148" r="5" fill="#0a0a0c"/><circle cx="336" cy="148" r="2" fill="#f2f2f2" opacity="0.8"/>
  <g fill="#0a0a0c" opacity="0.85"><circle cx="324" cy="168" r="2"/><circle cx="336" cy="168" r="2"/><circle cx="348" cy="168" r="2"/></g>
  <!-- нижняя часть: пустая плашка с точками -->
  <rect x="272" y="318" width="76" height="28" rx="8" fill="none" stroke="#f2f2f2" stroke-width="1.4" opacity="0.2"/>
  <g fill="#f2f2f2" opacity="0.22"><circle cx="296" cy="332" r="2.2"/><circle cx="310" cy="332" r="2.2"/><circle cx="324" cy="332" r="2.2"/></g>
</svg>
