  <path d="M112 150 L 488 150" stroke="#fff" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  <circle cx="96" cy="142" r="9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="96" cy="142" r="3.4" fill="#17171a" opacity="0.75"/><path d="M91 142h10" stroke="#f2f2f2" stroke-width="1.2" opacity="0.7"/>
  <circle cx="504" cy="142" r="9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="504" cy="142" r="3.4" fill="#17171a" opacity="0.75"/><path d="M499 142h10" stroke="#f2f2f2" stroke-width="1.2" opacity="0.7"/>
  <circle cx="96" cy="342" r="9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="96" cy="342" r="3.4" fill="#17171a" opacity="0.75"/><path d="M91 342h10" stroke="#f2f2f2" stroke-width="1.2" opacity="0.7"/>
  <circle cx="504" cy="342" r="9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/><circle cx="504" cy="342" r="3.4" fill="#17171a" opacity="0.75"/><path d="M499 342h10" stroke="#f2f2f2" stroke-width="1.2" opacity="0.7"/>

