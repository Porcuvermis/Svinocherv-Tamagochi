    <path d="M232 170v7"/><path d="M184 182l4 6"/><path d="M280 182l-4 6"/><path d="M158 222l6 3"/><path d="M306 222l-6 3"/><path d="M152 244h7"/><path d="M305 244h7"/>
  </g>
  <circle cx="232" cy="244" r="61" fill="none" stroke="#17171a" stroke-width="1.5"/>
  <circle cx="232" cy="244" r="56" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="232" cy="244" r="48" fill="#0c0c0e" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="232" cy="244" r="44" fill="none" stroke="#f2f2f2" stroke-width="2.4" opacity="0.88"/>
  <circle cx="232" cy="244" r="39" fill="url(#glass)" stroke="#17171a" stroke-width="1.9"/>
  <circle cx="232" cy="244" r="39" fill="url(#glassEdge)"/>
  <circle cx="232" cy="244" r="26" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>
  <circle cx="232" cy="244" r="7" fill="#050506" stroke="#bdbdc2" stroke-width="1" opacity="0.7"/>
