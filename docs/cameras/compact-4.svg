  <rect x="360" y="164" width="92" height="38" rx="9" fill="#17171a" stroke="#17171a" stroke-width="2"/>
  <rect x="365" y="169" width="82" height="28" rx="6" fill="#e0e0e4" stroke="#17171a" stroke-width="1.4"/>
  <rect x="365" y="169" width="82" height="28" rx="6" fill="url(#grid)"/>
