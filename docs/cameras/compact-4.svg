  <polygon points="203.5,164.1 199.7,167.9 194.5,166.5 193.1,161.3 196.9,157.5 202.1,158.9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="198.3" cy="162.7" r="1.8" fill="#17171a" opacity="0.7"/>
  <polygon points="270.9,164.1 267.1,167.9 261.9,166.5 260.5,161.3 264.3,157.5 269.5,158.9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="265.7" cy="162.7" r="1.8" fill="#17171a" opacity="0.7"/>
  <polygon points="318.5,211.7 314.7,215.5 309.5,214.1 308.1,208.9 311.9,205.1 317.1,206.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="313.3" cy="210.3" r="1.8" fill="#17171a" opacity="0.7"/>

  <circle cx="232" cy="244" r="78" fill="url(#barrel)" stroke="#17171a" stroke-width="2.4"/>
