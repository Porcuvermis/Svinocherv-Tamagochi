  <rect x="357" y="277" width="94" height="20" rx="5" fill="none" stroke="#f2f2f2" stroke-width="1" opacity="0.5"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="378" cy="287" r="2"/><circle cx="404" cy="287" r="2"/><circle cx="430" cy="287" r="2"/></g>

