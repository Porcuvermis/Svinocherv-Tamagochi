  <!-- резиновая рама: толстая, с рёбрами по углам -->
  <rect x="70" y="116" width="460" height="252" rx="44" fill="url(#gloss)" stroke="#17171a" stroke-width="2.8"/>
  <g clip-path="url(#bodyClip)">
