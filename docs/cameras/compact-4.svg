  <circle cx="232" cy="244" r="100" fill="#101012" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="232" cy="244" r="96" fill="url(#chrome)" stroke="#17171a" stroke-width="2.2"/>
  <polygon points="318.5,279.1 314.7,282.9 309.5,281.5 308.1,276.3 311.9,272.5 317.1,273.9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="313.3" cy="277.7" r="1.8" fill="#17171a" opacity="0.7"/>
  <polygon points="270.9,326.7 267.1,330.5 261.9,329.1 260.5,323.9 264.3,320.1 269.5,321.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="265.7" cy="325.3" r="1.8" fill="#17171a" opacity="0.7"/>
  <polygon points="203.5,326.7 199.7,330.5 194.5,329.1 193.1,323.9 196.9,320.1 202.1,321.5" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="198.3" cy="325.3" r="1.8" fill="#17171a" opacity="0.7"/>
  <polygon points="155.9,279.1 152.1,282.9 146.9,281.5 145.5,276.3 149.3,272.5 154.5,273.9" fill="url(#chrome)" stroke="#17171a" stroke-width="1.4"/><circle cx="150.7" cy="277.7" r="1.8" fill="#17171a" opacity="0.7"/>
