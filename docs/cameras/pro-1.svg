<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5266"/><stop offset="0.12" stop-color="#443c4f"/>
      <stop offset="1" stop-color="#2a2332"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e1ea"/><stop offset="0.5" stop-color="#b9b6c4"/><stop offset="1" stop-color="#8a8696"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5d2de"/><stop offset="1" stop-color="#8f8b9d"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2332"/><stop offset="0.55" stop-color="#4a4256"/><stop offset="1" stop-color="#352d3f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eff6"/><stop offset="0.45" stop-color="#a8a4b6"/><stop offset="1" stop-color="#6e6a7e"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f4760"/><stop offset="0.4" stop-color="#2d2638"/><stop offset="1" stop-color="#171220"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#3b3fa8"/><stop offset="0.45" stop-color="#1c1a58"/><stop offset="1" stop-color="#0a0820"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#7a2a8c" stop-opacity="0"/><stop offset="1" stop-color="#9b3fb0" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#1b1522" opacity="0.55"/><circle cx="4.5" cy="4.5" r="0.7" fill="#1b1522" opacity="0.55"/>
    </pattern>
    <pattern id="ridge" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="3" fill="#1d1726" opacity="0.65"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="38" y="132" width="524" height="252" rx="28"/></clipPath>
  </defs>

  <!-- ремешковые проушины -->
  <g stroke="#23101d" stroke-width="2.2" fill="url(#metal)">
    <rect x="22" y="168" width="24" height="42" rx="9"/><rect x="554" y="168" width="24" height="42" rx="9"/>
  </g>
  <g fill="#23101d"><rect x="29" y="180" width="10" height="18" rx="5"/><rect x="561" y="180" width="10" height="18" rx="5"/></g>

  <!-- призма: горб над объективом, чуть смещён влево -->
  <path d="M196 140 C 200 96 232 64 286 62 L 352 62 C 396 64 420 94 424 140 Z"
        fill="url(#prism)" stroke="#23101d" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M214 132 C 220 102 242 82 280 80 L 346 80 C 380 82 398 102 404 132"
        fill="none" stroke="#f4f2f8" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  <!-- башмак -->
  <rect x="262" y="48" width="96" height="16" rx="4" fill="url(#metal)" stroke="#23101d" stroke-width="1.7"/>
  <rect x="274" y="53" width="72" height="5" rx="2" fill="#23101d" opacity="0.6"/>
  <!-- окошко и огонёк призмы -->
  <rect x="270" y="96" width="80" height="22" rx="7" fill="#1a1426" stroke="#23101d" stroke-width="1.7"/>
  <rect x="276" y="100" width="40" height="7" rx="3.5" fill="#6b64a8" opacity="0.7"/>
  <circle cx="372" cy="108" r="5.5" fill="#e0a43c" stroke="#23101d" stroke-width="1.2"/>
  <circle cx="370.5" cy="106.5" r="1.8" fill="#fff2c4"/>

  <!-- верхняя панель -->
  <path d="M44 150 C 44 126 60 112 84 112 L 196 112 L 196 150 Z" fill="url(#plate)" stroke="#23101d" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M424 112 L 520 112 C 544 112 558 126 558 150 L 424 150 Z" fill="url(#plate)" stroke="#23101d" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- диск режимов: рифлёный цилиндр -->
  <g>
    <rect x="452" y="88" width="76" height="30" rx="8" fill="url(#metal)" stroke="#23101d" stroke-width="2"/>
    <g stroke="#23101d" stroke-width="1.4" opacity="0.7">
      <path d="M462 90v26M470 90v26M478 90v26M486 90v26M494 90v26M502 90v26M510 90v26M518 90v26"/>
    </g>
    <rect x="456" y="91" width="68" height="6" rx="3" fill="#fff" opacity="0.35"/>
  </g>
  <!-- спуск -->
  <g>
    <ellipse cx="124" cy="102" rx="26" ry="9" fill="#23101d" opacity="0.35"/>
    <rect x="100" y="86" width="48" height="26" rx="13" fill="#d99a35" stroke="#23101d" stroke-width="2.2"/>
    <ellipse cx="124" cy="90" rx="17" ry="5" fill="#ffe3a0" opacity="0.8"/>
  </g>
  <!-- малый диск рядом -->
  <rect x="158" y="96" width="28" height="18" rx="6" fill="url(#metal)" stroke="#23101d" stroke-width="1.7"/>
  <!-- экранчик на плече -->
  <rect x="436" y="124" width="56" height="18" rx="5" fill="#1b2a3a" stroke="#23101d" stroke-width="1.7"/>
  <rect x="442" y="129" width="30" height="4" rx="2" fill="#7fd1c4" opacity="0.8"/><rect x="442" y="135" width="18" height="3" rx="1.5" fill="#7fd1c4" opacity="0.5"/>

  <!-- корпус -->
  <rect x="38" y="132" width="524" height="252" rx="28" fill="url(#body)" stroke="#23101d" stroke-width="2.6"/>
  <rect x="38" y="154" width="524" height="230" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <!-- верхняя кромка блик -->
  <path d="M60 158 L540 158" stroke="#9b90ac" stroke-width="2.4" opacity="0.5" stroke-linecap="round"/>
  <!-- нижняя кромка -->
  <path d="M60 372 L540 372" stroke="#1a1421" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <rect x="38" y="352" width="524" height="32" rx="0" fill="#1a1421" opacity="0.25" clip-path="url(#bodyClip)"/>

  <!-- рукоятка слева -->
  <path d="M38 160 C 38 150 46 144 58 144 L 150 144 C 168 150 176 176 176 230 C 176 300 168 350 150 384 L 66 384 C 46 384 38 372 38 350 Z"
        fill="url(#grip)" stroke="#23101d" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M42 172 C 42 214 42 300 44 360" stroke="#7c708f" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round"/>
  <g clip-path="url(#bodyClip)"><rect x="60" y="214" width="116" height="150" fill="url(#ridge)" opacity="0.8"/></g>
  <!-- диск под пальцем -->
  <ellipse cx="118" cy="190" rx="22" ry="14" fill="url(#metal)" stroke="#23101d" stroke-width="2"/>
  <ellipse cx="118" cy="186" rx="14" ry="6" fill="#fff" opacity="0.4"/>
  <!-- лампочка помощи фокуса -->
  <circle cx="150" cy="170" r="7" fill="#2a1d36" stroke="#23101d" stroke-width="1.7"/>
  <circle cx="148" cy="168" r="2.4" fill="#c55a6a" opacity="0.9"/>

  <!-- правая сторона: заглушка и кнопка -->
  <rect x="496" y="206" width="48" height="16" rx="8" fill="#20192a" stroke="#23101d" stroke-width="1.7"/>
  <circle cx="520" cy="262" r="12" fill="url(#metal)" stroke="#23101d" stroke-width="1.7"/>
  <circle cx="520" cy="262" r="5" fill="#23101d" opacity="0.5"/>

  <!-- ===== ОБЪЕКТИВ: центр (320, 264) ===== -->
  <ellipse cx="322" cy="372" rx="108" ry="10" fill="#23101d" opacity="0.28"/>
  <!-- байонет -->
  <circle cx="320" cy="264" r="124" fill="url(#metal)" stroke="#23101d" stroke-width="2.6"/>
  <circle cx="320" cy="264" r="116" fill="none" stroke="#23101d" stroke-width="1.2" opacity="0.5"/>
  <g fill="#23101d" opacity="0.8"><circle cx="320" cy="148" r="3.4"/><circle cx="214" cy="326" r="3.4"/><circle cx="426" cy="326" r="3.4"/></g>
  <!-- кнопка расстыковки -->
  <rect x="418" y="196" width="22" height="30" rx="8" fill="#d99a35" stroke="#23101d" stroke-width="1.8" transform="rotate(32 429 211)"/>
  <!-- ствол -->
  <circle cx="320" cy="264" r="108" fill="url(#barrel)" stroke="#23101d" stroke-width="2.6"/>
  <!-- рифлёное кольцо фокуса -->
  <circle cx="320" cy="264" r="96" fill="none" stroke="#0f0a17" stroke-width="16"/>
  <circle cx="320" cy="264" r="96" fill="none" stroke="#7d7390" stroke-width="16" stroke-dasharray="2.4 3.88" opacity="0.8"/>
  <circle cx="320" cy="264" r="104" fill="none" stroke="#23101d" stroke-width="1.7"/>
  <circle cx="320" cy="264" r="88" fill="none" stroke="#23101d" stroke-width="1.7"/>
  <!-- тонкое янтарное кольцо -->
  <circle cx="320" cy="264" r="80" fill="none" stroke="#d99a35" stroke-width="5"/>
  <circle cx="320" cy="264" r="82.6" fill="none" stroke="#23101d" stroke-width="1.2"/>
  <circle cx="320" cy="264" r="77.4" fill="none" stroke="#23101d" stroke-width="1.2"/>
  <!-- внутренний срез -->
  <circle cx="320" cy="264" r="72" fill="#120d1c" stroke="#23101d" stroke-width="1.7"/>
  <circle cx="320" cy="264" r="66" fill="none" stroke="#6b6180" stroke-width="3" opacity="0.8"/>
  <!-- стекло -->
  <circle cx="320" cy="264" r="58" fill="url(#glass)" stroke="#23101d" stroke-width="2"/>
  <circle cx="320" cy="264" r="58" fill="url(#glassEdge)"/>
  <circle cx="320" cy="264" r="38" fill="none" stroke="#6a6ee0" stroke-width="1.4" opacity="0.5"/>
  <circle cx="320" cy="264" r="20" fill="none" stroke="#6a6ee0" stroke-width="1.2" opacity="0.45"/>
  <!-- отражение шестилепесткового зрачка -->
  <path d="M320 248 l14 8 v16 l-14 8 l-14 -8 v-16 z" fill="#0a0820" stroke="#7a6fd8" stroke-width="1.2" opacity="0.75"/>
  <!-- блики: крупный мягкий и малые -->
  <path d="M278 238 C 284 216 310 204 336 208 C 316 214 298 226 290 246 Z" fill="url(#shine)"/>
  <circle cx="352" cy="294" r="8" fill="#fff" opacity="0.5"/>
  <circle cx="340" cy="304" r="3.4" fill="#fff" opacity="0.7"/>
</svg>
