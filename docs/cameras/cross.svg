<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Камера-крестик: цифровая профессиональная камера — сатиновая верхняя панель, низкий горб видоискателя, два диска, рукоять, обтяжка со строчкой; широкий объектив закрыт колпачком с крупным белым крестом. Только для крестика окна. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="46" y="100" width="508" height="276" rx="22"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <radialGradient id="cap" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#5a5a60"/><stop offset="0.55" stop-color="#34343a"/><stop offset="1" stop-color="#1c1c20"/>
    </radialGradient>
    <linearGradient id="xwhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfcfd4"/>
    </linearGradient>

    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c4c8"/><stop offset="0.18" stop-color="#9a9a9e"/><stop offset="0.7" stop-color="#66666a"/><stop offset="1" stop-color="#4a4a4e"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse"><rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.3"/></pattern>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="0.5" stop-color="#2a2a2e"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
</defs>
  <!-- ушки ремня -->
  <g stroke="#17171a" stroke-width="2.2" fill="url(#chrome)">
    <path d="M48 150 L 28 158 L 28 190 L 48 198 Z" stroke-linejoin="round"/><path d="M552 150 L 572 158 L 572 190 L 552 198 Z" stroke-linejoin="round"/>
  </g>
  <g fill="#17171a"><circle cx="38" cy="174" r="5"/><circle cx="562" cy="174" r="5"/></g>

  <!-- низкий горб видоискателя по центру -->
  <path d="M232 106 L 242 66 C 244 58 250 54 258 54 L 342 54 C 350 54 356 58 358 66 L 368 106 Z"
        fill="url(#topmetal)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M248 100 L 256 70 L 344 70 L 352 100" fill="none" stroke="#fff" stroke-width="2.2" opacity="0.35" stroke-linejoin="round"/>
  <rect x="270" y="78" width="60" height="16" rx="6" fill="#0b0b0d" stroke="#17171a" stroke-width="1.7"/>
  <rect x="276" y="81" width="24" height="4" rx="2" fill="#fff" opacity="0.28"/>
  <rect x="262" y="40" width="76" height="16" rx="4" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>
  <rect x="272" y="45" width="56" height="5" rx="2" fill="#17171a" opacity="0.6"/>

  <!-- верхняя панель: сатиновый металл -->
  <path d="M52 156 C 52 126 66 108 94 108 L 506 108 C 534 108 548 126 548 156 Z"
        fill="url(#topmetal)" stroke="#17171a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M72 118 L 232 118 M368 118 L 528 118" stroke="#fff" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <g stroke="#17171a" stroke-width="1.2" opacity="0.5" fill="none"><path d="M72 142h150M378 142h150"/></g>

  <!-- диск режимов слева: рифлёный, белый индекс, блокировка -->
  <ellipse cx="128" cy="108" rx="50" ry="6" fill="#17171a" opacity="0.4"/>
  <rect x="80" y="72" width="96" height="36" rx="10" fill="url(#dark)" stroke="#17171a" stroke-width="2.2"/>
  <g stroke="#f2f2f2" stroke-width="1.8" opacity="0.85"><path d="M90 77v26M99 77v26M108 77v26M117 77v26M126 77v26M135 77v26M144 77v26M153 77v26M162 77v26"/></g>
  <rect x="84" y="75" width="88" height="5" rx="2.5" fill="#fff" opacity="0.22"/>
  <rect x="184" y="88" width="26" height="18" rx="6" fill="url(#chrome)" stroke="#17171a" stroke-width="1.8"/>
  <circle cx="197" cy="97" r="3.2" fill="#17171a" opacity="0.7"/>
  <!-- диск выдержки справа и спуск -->
  <ellipse cx="452" cy="108" rx="46" ry="6" fill="#17171a" opacity="0.4"/>
  <rect x="406" y="72" width="92" height="36" rx="10" fill="url(#dark)" stroke="#17171a" stroke-width="2.2"/>
  <g stroke="#f2f2f2" stroke-width="1.8" opacity="0.85"><path d="M416 77v26M425 77v26M434 77v26M443 77v26M452 77v26M461 77v26M470 77v26M479 77v26M488 77v26"/></g>
  <rect x="410" y="75" width="84" height="5" rx="2.5" fill="#fff" opacity="0.22"/>
  <circle cx="530" cy="92" r="16" fill="url(#chrome)" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="530" cy="92" r="10" fill="url(#dark)" stroke="#17171a" stroke-width="1.6"/>
  <ellipse cx="528" cy="88" rx="5" ry="2.2" fill="#fff" opacity="0.55"/>
  <!-- табло -->
  <rect x="402" y="120" width="62" height="20" rx="5" fill="#0b0b0d" stroke="#17171a" stroke-width="1.7"/>
  <g stroke="#f2f2f2" stroke-width="2" stroke-linecap="round"><path d="M412 130h12M430 130h6M442 130h14" opacity="0.9"/></g>
  <rect x="140" y="120" width="62" height="20" rx="5" fill="#0b0b0d" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="156" cy="130" r="5" fill="none" stroke="#f2f2f2" stroke-width="1.6" opacity="0.9"/>
  <g stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round" opacity="0.8"><path d="M168 130h24M168 125h14"/></g>

  <!-- корпус: чёрная обтяжка, тонкая строчка по краю -->
  <rect x="46" y="150" width="508" height="226" rx="22" fill="url(#body)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="46" y="156" width="508" height="220" fill="url(#leather)" clip-path="url(#bodyClip)"/>
  <rect x="58" y="166" width="484" height="198" rx="14" fill="none" stroke="#9a9aa0" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.28"/>
  <path d="M70 158 L 530 158" stroke="#fff" stroke-width="2.4" opacity="0.2" stroke-linecap="round"/>
  <!-- нижняя сатиновая планка -->
  <path d="M52 346 L 548 346 L 548 354 C 548 366 538 376 524 376 L 76 376 C 62 376 52 366 52 354 Z" fill="url(#topmetal)" stroke="#17171a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M74 351 L 526 351" stroke="#fff" stroke-width="2" opacity="0.45" stroke-linecap="round"/>

  <!-- ремешок: петля шнура от колпачка к ушку -->
  <path d="M214 330 C 150 370 96 366 76 316" fill="none" stroke="#17171a" stroke-width="7" stroke-linecap="round"/>
  <path d="M214 330 C 150 370 96 366 76 316" fill="none" stroke="#5a5a60" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="74" cy="306" r="11" fill="none" stroke="#17171a" stroke-width="7"/><circle cx="74" cy="306" r="11" fill="none" stroke="url(#chrome)" stroke-width="3.6"/>

  <!-- левая сторона: кнопка быстрого меню, лампа, микрофонные точки -->
  <circle cx="98" cy="200" r="11" fill="url(#dark)" stroke="#17171a" stroke-width="1.8"/><rect x="92" y="198" width="12" height="4" rx="2" fill="#f2f2f2" opacity="0.9"/>
  <circle cx="98" cy="234" r="6" fill="#17171a"/><circle cx="98" cy="234" r="2.4" fill="#f2f2f2" opacity="0.85"/>
  <g fill="#0a0a0c" opacity="0.85"><circle cx="84" cy="262" r="2.2"/><circle cx="94" cy="262" r="2.2"/><circle cx="104" cy="262" r="2.2"/><circle cx="114" cy="262" r="2.2"/></g>
  <!-- правая сторона: рукоять-валик, переднее колёсико, датчик -->
  <path d="M554 164 C 554 156 548 150 540 150 L 450 150 C 438 180 434 230 434 262 C 434 308 438 346 450 376 L 540 376 C 548 376 554 370 554 362 Z"
        fill="url(#gripd)" stroke="#17171a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M548 176 C 550 220 550 300 546 350" stroke="#fff" stroke-width="3" opacity="0.2" fill="none" stroke-linecap="round"/>
  <g clip-path="url(#bodyClip)"><rect x="446" y="226" width="106" height="120" fill="url(#stitch)"/></g>
  <ellipse cx="492" cy="188" rx="26" ry="14" fill="url(#dark)" stroke="#17171a" stroke-width="2"/>
  <g stroke="#f2f2f2" stroke-width="1.5" opacity="0.8"><path d="M474 183v10M481 181v14M488 180v16M495 180v16M502 181v14M509 183v10"/></g>
  <ellipse cx="492" cy="182" rx="17" ry="4" fill="#fff" opacity="0.18"/>
  <circle cx="450" cy="214" r="8" fill="#1a1a1d" stroke="#17171a" stroke-width="1.6"/><circle cx="448.4" cy="212.4" r="2.6" fill="#e8e8e8" opacity="0.85"/>
  <rect x="470" y="292" width="62" height="28" rx="7" fill="#0e0e10" stroke="#17171a" stroke-width="1.6"/>
  <rect x="475" y="296" width="52" height="20" rx="4" fill="none" stroke="#f2f2f2" stroke-width="1" opacity="0.5"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="488" cy="306" r="2"/><circle cx="501" cy="306" r="2"/><circle cx="514" cy="306" r="2"/></g>

  <!-- ===== КОЛПАЧОК НА ШИРОКОМ ОБЪЕКТИВЕ: центр (300, 240) ===== -->
  <!-- хромовая оправа объектива -->
  <circle cx="300" cy="240" r="124" fill="url(#chrome)" stroke="#17171a" stroke-width="2.8"/>
  <circle cx="300" cy="240" r="116" fill="none" stroke="#17171a" stroke-width="1.4" opacity="0.5"/>
  <!-- кромка колпачка с накаткой и двумя зажимами -->
  <circle cx="300" cy="240" r="112" fill="url(#gloss)" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="300" cy="240" r="105" fill="none" stroke="#85858b" stroke-width="9" stroke-dasharray="3 4.4" opacity="0.65"/>
  <g stroke="#17171a" stroke-width="2"><rect x="184" y="222" width="22" height="36" rx="7" fill="url(#dark)"/><rect x="394" y="222" width="22" height="36" rx="7" fill="url(#dark)"/></g>
  <g stroke="#f2f2f2" stroke-width="1.4" opacity="0.75"><path d="M189 230h12M189 240h12M189 250h12M399 230h12M399 240h12M399 250h12"/></g>
  <!-- лицо колпачка -->
  <circle cx="300" cy="240" r="96" fill="url(#cap)" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="300" cy="240" r="96" fill="none" stroke="#fff" stroke-width="2" opacity="0.18"/>
  <circle cx="300" cy="240" r="84" fill="none" stroke="#17171a" stroke-width="1.6" opacity="0.6"/>
  <path d="M232 176 C 252 156 290 148 326 154 C 292 160 262 172 242 194 Z" fill="#fff" opacity="0.12"/>
  <!-- крест: толстый белый с тёмной обводкой -->
  <g fill="#17171a" stroke="#17171a" stroke-width="9" stroke-linejoin="round"><g transform="rotate(45 300 240)"><rect x="214" y="221" width="172" height="38" rx="10" /></g><g transform="rotate(-45 300 240)"><rect x="214" y="221" width="172" height="38" rx="10" /></g></g>
  <g fill="url(#xwhite)"><g transform="rotate(45 300 240)"><rect x="214" y="221" width="172" height="38" rx="10" /></g><g transform="rotate(-45 300 240)"><rect x="214" y="221" width="172" height="38" rx="10" /></g></g>
  <g fill="none" stroke="#fff" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <path d="M258 198 L 286 226"/><path d="M342 198 L 314 226"/>
  </g>
</svg>
