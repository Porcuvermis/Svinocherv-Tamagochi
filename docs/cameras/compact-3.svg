<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Мыльница №3: ультратонкая вертикальная — один глянцевый графитовый корпус в хромовой окантовке, крупный объектив в углу, вспышка рядом, боковые кнопки. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="200" y="30" width="200" height="314" rx="40"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <pattern id="brush" width="4" height="4" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="1" height="4" fill="#fff" opacity="0.06"/></pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
</defs>
  <!-- боковые кнопки: спуск справа, питание сверху -->
  <rect x="396" y="116" width="14" height="52" rx="6" fill="url(#silver)" stroke="#17171a" stroke-width="2"/>
  <rect x="396" y="186" width="12" height="30" rx="5" fill="url(#silver)" stroke="#17171a" stroke-width="1.8"/>
  <rect x="318" y="20" width="54" height="16" rx="7" fill="url(#silver)" stroke="#17171a" stroke-width="2"/>
  <circle cx="345" cy="28" r="3.6" fill="none" stroke="#17171a" stroke-width="1.6"/><path d="M345 22.4v3.4" stroke="#17171a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- корпус: хромовая окантовка и графитовое лицо одним куском -->
  <rect x="196" y="28" width="208" height="318" rx="42" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="204" y="36" width="192" height="302" rx="35" fill="url(#gloss)" stroke="#17171a" stroke-width="2"/>
  <rect x="204" y="36" width="192" height="302" rx="35" fill="url(#brush)"/>
  <path d="M232 44 L 368 44" stroke="#fff" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

  <!-- ушко ремешка внизу слева -->
  <circle cx="226" cy="316" r="9" fill="none" stroke="url(#chrome)" stroke-width="5"/><circle cx="226" cy="316" r="9" fill="none" stroke="#17171a" stroke-width="1.2"/>

  <g transform="translate(272 126) scale(0.88) translate(-262 -126)">
  <!-- ===== ОБЪЕКТИВ: центр (262, 126), выступает хромовым кольцом ===== -->
  <ellipse cx="266" cy="136" rx="72" ry="68" fill="#0a0a0c" opacity="0.4"/>
  <circle cx="262" cy="126" r="68" fill="url(#chrome)" stroke="#17171a" stroke-width="2.6"/>
  <circle cx="262" cy="126" r="62" fill="none" stroke="#17171a" stroke-width="1.2" opacity="0.5"/>
  <circle cx="262" cy="126" r="58" fill="url(#barrel)" stroke="#17171a" stroke-width="2.2"/>
  <circle cx="262" cy="126" r="50" fill="none" stroke="#0a0a0c" stroke-width="9"/>
  <circle cx="262" cy="126" r="50" fill="none" stroke="#85858b" stroke-width="9" stroke-dasharray="1.6 2.6" opacity="0.65"/>
  <g stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" opacity="0.92">
    <path d="M262 72v6"/><path d="M225 80l3 5"/><path d="M299 80l-3 5"/><path d="M206 108l5 3"/><path d="M318 108l-5 3"/>
  </g>
  <circle cx="262" cy="126" r="44" fill="none" stroke="#17171a" stroke-width="1.4"/>
  <circle cx="262" cy="126" r="40" fill="url(#chrome)" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="262" cy="126" r="33" fill="#0c0c0e" stroke="#17171a" stroke-width="1.5"/>
  <circle cx="262" cy="126" r="30" fill="none" stroke="#f2f2f2" stroke-width="2" opacity="0.88"/>
  <circle cx="262" cy="126" r="26" fill="url(#glass)" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="262" cy="126" r="26" fill="url(#glassEdge)"/>
  <circle cx="262" cy="126" r="5" fill="#050506" stroke="#bdbdc2" stroke-width="1" opacity="0.7"/>
  <path d="M240 114 C 244 104 256 98 270 100 C 258 104 250 110 246 120 Z" fill="url(#shine)"/>
  <circle cx="278" cy="140" r="4.6" fill="#fff" opacity="0.5"/>

  </g>
  <!-- вспышка справа от объектива -->
  <rect x="334" y="86" width="52" height="30" rx="8" fill="#17171a" stroke="#17171a" stroke-width="2"/>
  <rect x="338" y="90" width="44" height="22" rx="5" fill="#e0e0e4" stroke="#17171a" stroke-width="1.2"/>
  <rect x="338" y="90" width="44" height="22" rx="5" fill="url(#grid)"/>
  <rect x="341" y="92" width="38" height="5" rx="2.5" fill="#fff" opacity="0.85"/>
  <!-- лампа автофокуса и датчик -->
  <circle cx="360" cy="140" r="8" fill="#17171a"/><circle cx="360" cy="140" r="4.6" fill="#8a8a90"/><circle cx="358.4" cy="138.4" r="1.6" fill="#fff"/>
  <circle cx="360" cy="162" r="5" fill="#17171a"/><circle cx="360" cy="162" r="2.2" fill="#f2f2f2" opacity="0.8"/>

  <g transform="translate(0,-66)">
  <!-- динамик: решётка из точек -->
  <g fill="#0a0a0c" opacity="0.85">
    <circle cx="238" cy="344" r="2.4"/><circle cx="250" cy="344" r="2.4"/><circle cx="262" cy="344" r="2.4"/><circle cx="274" cy="344" r="2.4"/><circle cx="286" cy="344" r="2.4"/><circle cx="298" cy="344" r="2.4"/>
    <circle cx="238" cy="356" r="2.4"/><circle cx="250" cy="356" r="2.4"/><circle cx="262" cy="356" r="2.4"/><circle cx="274" cy="356" r="2.4"/><circle cx="286" cy="356" r="2.4"/><circle cx="298" cy="356" r="2.4"/>
  </g>
  <!-- пустая пластинка с белыми точками -->
  <rect x="318" y="334" width="62" height="34" rx="8" fill="#0a0a0c" stroke="#17171a" stroke-width="1.8"/>
  <rect x="323" y="339" width="52" height="24" rx="5" fill="none" stroke="#f2f2f2" stroke-width="1" opacity="0.5"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="336" cy="351" r="2"/><circle cx="349" cy="351" r="2"/><circle cx="362" cy="351" r="2"/></g>

  </g>
  <!-- общий диагональный блик по глянцу -->
  <g clip-path="url(#bodyClip)"><path d="M204 36 L 396 36 L 204 240 Z" fill="url(#sweep)"/></g>
</svg>
