<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <!-- Мыльница №3: ультратонкая — графитовый корпус, открытая ниша объектива слева, серебристая скользящая шторка справа с вспышкой, кольцо зума вокруг спуска. Серые, чёрное, белые метки. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484b"/><stop offset="0.1" stop-color="#343437"/><stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="0.5" stop-color="#47474b"/><stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3d"/><stop offset="0.5" stop-color="#2a2a2d"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="0.45" stop-color="#8a8a8f"/><stop offset="1" stop-color="#525256"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585c"/><stop offset="1" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c40"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="inhood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#55555b"/><stop offset="0.45" stop-color="#26262a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glassEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.68" stop-color="#ccc" stop-opacity="0"/><stop offset="1" stop-color="#e0e0e0" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="leather" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.65" fill="#0c0c0e" opacity="0.6"/><circle cx="3.7" cy="3.7" r="0.65" fill="#0c0c0e" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="60" y="140" width="480" height="196" rx="30"/></clipPath>
  
    <linearGradient id="topmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b4b8"/><stop offset="0.18" stop-color="#8e8e92"/><stop offset="0.7" stop-color="#5e5e62"/><stop offset="1" stop-color="#46464a"/>
    </linearGradient>
    <pattern id="stitch" width="10" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="2.2" width="5" height="1.6" rx="0.8" fill="#9a9a9e" opacity="0.28"/>
    </pattern>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/><stop offset="0.3" stop-color="#c2c2c6"/><stop offset="0.55" stop-color="#8a8a90"/><stop offset="0.78" stop-color="#b6b6ba"/><stop offset="1" stop-color="#76767a"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e72"/><stop offset="0.25" stop-color="#e6e6ea"/><stop offset="0.5" stop-color="#a0a0a6"/><stop offset="0.8" stop-color="#d4d4d8"/><stop offset="1" stop-color="#707074"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ec"/><stop offset="0.35" stop-color="#c6c6cc"/><stop offset="0.8" stop-color="#9a9aa0"/><stop offset="1" stop-color="#7e7e84"/>
    </linearGradient>
    <linearGradient id="gripd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46464a"/><stop offset="0.5" stop-color="#2e2e32"/><stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#0e0e10" opacity="0.55"/></pattern>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 0v6" stroke="#17171a" stroke-width="1" opacity="0.3"/></pattern>

    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8dc"/><stop offset="1" stop-color="#a4a4aa"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="7" height="14" fill="#17171a" opacity="0.85"/>
    </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5f"/><stop offset="0.12" stop-color="#3a3a3e"/><stop offset="0.6" stop-color="#232326"/><stop offset="1" stop-color="#151517"/>
    </linearGradient>
  
    <pattern id="brush" width="4" height="4" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="1" height="4" fill="#fff" opacity="0.07"/></pattern>
</defs>
  <!-- ушко ремешка слева -->
  <g stroke="#17171a" stroke-width="2.2"><rect x="44" y="196" width="26" height="30" rx="12" fill="url(#silver)"/></g>
  <circle cx="57" cy="211" r="5" fill="#17171a" opacity="0.8"/>

  <!-- верх: кольцо зума вокруг спуска, питание -->
  <ellipse cx="450" cy="140" rx="40" ry="6" fill="#17171a" opacity="0.4"/>
  <rect x="404" y="112" width="92" height="32" rx="16" fill="url(#silver)" stroke="#17171a" stroke-width="2.2"/>
  <g stroke="#17171a" stroke-width="1.4" opacity="0.45"><path d="M414 117v22M422 117v22M478 117v22M486 117v22"/></g>
  <rect x="432" y="116" width="36" height="24" rx="12" fill="url(#dark)" stroke="#17171a" stroke-width="1.6"/>
  <ellipse cx="450" cy="121" rx="12" ry="3" fill="#fff" opacity="0.4"/>
  <rect x="340" y="120" width="40" height="22" rx="9" fill="url(#silver)" stroke="#17171a" stroke-width="2"/>
  <circle cx="360" cy="131" r="5" fill="none" stroke="#17171a" stroke-width="1.8"/><path d="M360 124v6" stroke="#17171a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- корпус: графит -->
  <rect x="60" y="140" width="480" height="196" rx="30" fill="url(#gloss)" stroke="#17171a" stroke-width="2.6"/>
  <rect x="60" y="140" width="480" height="196" rx="30" fill="url(#brush)"/>
  <path d="M96 150 L 504 150" stroke="#fff" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

  <!-- правая часть: скользящая серебристая шторка -->
  <path d="M296 140 L 510 140 C 528 140 540 154 540 172 L 540 304 C 540 322 528 336 510 336 L 296 336 Z"
        fill="url(#silver)" stroke="#17171a" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="296" y="140" width="244" height="196" fill="url(#brush)" opacity="2"/>
  <path d="M310 152 L 520 152" stroke="#fff" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  <!-- направляющая шторки: белые риски -->
  <rect x="284" y="140" width="14" height="196" fill="#101012" stroke="#17171a" stroke-width="1.6"/>
  <g stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" opacity="0.85"><path d="M288 168h6M288 184h6M288 200h6M288 216h6M288 232h6M288 248h6M288 264h6M288 280h6M288 296h6M288 312h6"/></g>
  <!-- вспышка на шторке -->
  <rect x="330" y="166" width="94" height="40" rx="9" fill="#17171a" stroke="#17171a" stroke-width="2"/>
  <rect x="335" y="171" width="84" height="30" rx="6" fill="#e0e0e4" stroke="#17171a" stroke-width="1.4"/>
  <rect x="335" y="171" width="84" height="30" rx="6" fill="url(#grid)"/>
  <rect x="339" y="174" width="76" height="6" rx="3" fill="#fff" opacity="0.85"/>
  <!-- лампа автофокуса и датчик -->
  <circle cx="456" cy="186" r="9" fill="#17171a" stroke="#17171a" stroke-width="1.6"/><circle cx="456" cy="186" r="5.2" fill="#8a8a90"/><circle cx="454.4" cy="184.4" r="1.8" fill="#fff"/>
  <circle cx="488" cy="186" r="6" fill="#17171a"/><circle cx="488" cy="186" r="2.6" fill="#f2f2f2" opacity="0.8"/>
  <!-- микрофонные точки -->
  <g fill="#17171a" opacity="0.75"><circle cx="340" cy="262" r="2.4"/><circle cx="352" cy="262" r="2.4"/><circle cx="364" cy="262" r="2.4"/><circle cx="340" cy="274" r="2.4"/><circle cx="352" cy="274" r="2.4"/><circle cx="364" cy="274" r="2.4"/></g>
  <!-- пустая пластина и белые точки -->
  <rect x="404" y="256" width="104" height="34" rx="8" fill="#17171a" stroke="#17171a" stroke-width="1.8"/>
  <rect x="409" y="261" width="94" height="24" rx="5" fill="none" stroke="#f2f2f2" stroke-width="1.1" opacity="0.5"/>
  <g fill="#f2f2f2" opacity="0.85"><circle cx="430" cy="273" r="2.2"/><circle cx="456" cy="273" r="2.2"/><circle cx="482" cy="273" r="2.2"/></g>

  <g transform="translate(176 238) scale(0.86) translate(-172 -238)">
  <!-- ===== ОБЪЕКТИВ: центр (172, 238), открытая ниша ===== -->
  <circle cx="172" cy="238" r="96" fill="#101012" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="172" cy="238" r="96" fill="none" stroke="#fff" stroke-width="2" opacity="0.12"/>
  <circle cx="172" cy="238" r="86" fill="url(#chrome)" stroke="#17171a" stroke-width="2.4"/>
  <circle cx="172" cy="238" r="79" fill="url(#barrel)" stroke="#17171a" stroke-width="2.2"/>
  <circle cx="172" cy="238" r="70" fill="none" stroke="#0a0a0c" stroke-width="11"/>
  <circle cx="172" cy="238" r="70" fill="none" stroke="#85858b" stroke-width="11" stroke-dasharray="1.8 2.8" opacity="0.65"/>
  <g stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" opacity="0.92">
    <path d="M172 164v7"/><path d="M127 172l3 6"/><path d="M217 172l-3 6"/><path d="M104 214l6 3"/><path d="M240 214l-6 3"/><path d="M96 238h7"/><path d="M241 238h7"/>
  </g>
  <circle cx="172" cy="238" r="63" fill="none" stroke="#17171a" stroke-width="1.5"/>
  <circle cx="172" cy="238" r="58" fill="url(#chrome)" stroke="#17171a" stroke-width="1.7"/>
  <circle cx="172" cy="238" r="50" fill="#0c0c0e" stroke="#17171a" stroke-width="1.6"/>
  <circle cx="172" cy="238" r="46" fill="none" stroke="#f2f2f2" stroke-width="2.2" opacity="0.88"/>
  <circle cx="172" cy="238" r="41" fill="url(#glass)" stroke="#17171a" stroke-width="1.9"/>
  <circle cx="172" cy="238" r="41" fill="url(#glassEdge)"/>
  <circle cx="172" cy="238" r="27" fill="none" stroke="#c8c8cc" stroke-width="1.2" opacity="0.28"/>
  <circle cx="172" cy="238" r="7" fill="#050506" stroke="#bdbdc2" stroke-width="1" opacity="0.7"/>
  <path d="M140 220 C 146 205 164 196 186 199 C 170 204 158 213 150 227 Z" fill="url(#shine)"/>
  <circle cx="198" cy="262" r="6.6" fill="#fff" opacity="0.5"/><circle cx="189" cy="271" r="2.8" fill="#fff" opacity="0.75"/>
  </g>
</svg>
