<!doctype html><meta charset="utf-8">
<!-- Банка-магазин на болванке (план 31, разд. 00): покой → тап, подскок →
     подлёт на игрока с полным оборотом (на задней стороне скотч подменяется:
     число монет → схема магазина) → в упор: скотч на весь экран, сверху
     пустое горло → вкидывание жетонов тапом и потоком (падают в горло и
     пропадают за скотчем) → тап вне скотча → обратно с оборотом.
     Кадр по времени: window.frame(t). Экран 390×844, фон прозрачный — кадр
     игры и рамка из монет кладутся при сборке (jar-anim.py). Только эскиз. -->
<body style="margin:0;background:transparent">
<canvas id="c" width="780" height="1688" style="width:390px;height:844px"></canvas>
<script src="../../../vendor/three.min.js"></script>
<script>
const D = Math.PI / 180, W = 390, H = 844, FOV = 40;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H, false); r.setClearColor(0, 0);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.01, 50);
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x302018, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(-2, 3, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe0b0, 0.6); rim.position.set(3, 1, -2); scene.add(rim);
const T = Math.tan(FOV / 2 * D);
// точка экрана (точки 390×844) на глубине d → мир
const at = (sx, sy, d) => new THREE.Vector3((sx / W * 2 - 1) * T * (W / H) * d, -(sy / H * 2 - 1) * T * d, -d);
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));

// ---------- скотч: две картинки — число монет и схема магазина ----------
// Скотч — естественная полоса малярного скотча (~четверть высоты банки),
// оторванный кусок спереди (60° по кругу). Во весь экран его выводит не
// ширина, а близость банки к камере (игрок, 17.11).
// Низ скотча заходит под рамку с запасом: при низе ровно на краю видимой
// зоны рамка и скотч вставали встык ровной полосой (игрок, 17.11).
// Длиннее (95° по кругу — прямоугольник, не квадратик) и чуть выше (0,15);
// верх на прежнем месте — поза «в упор» та же (игрок, 17.11).
const TAPE = { y0: -0.232, y1: -0.082, arc: 95 * D };
// холст — в пропорции куска скотча (дуга 0,1495 × высота 0,13), иначе рисунок
// растягивается по вертикали
function tapeCanvas() { const c = document.createElement('canvas'); c.width = 3072; c.height = 1862; return c; }
const tapeCv = tapeCanvas(), tapeTex = new THREE.CanvasTexture(tapeCv);
const INK = '#1d1a24';
function paper(g) {
  const Wc = 3072, Hc = 1862;
  g.clearRect(0, 0, Wc, Hc);
  // рваные концы куска скотча — зубчатый край слева и справа
  g.beginPath(); g.moveTo(30, 0);
  for (let y = 0; y <= Hc; y += 40) g.lineTo(18 + ((y * 7) % 23), y);
  g.lineTo(Wc - 30, Hc);
  for (let y = Hc; y >= 0; y -= 40) g.lineTo(Wc - 18 - ((y * 11) % 23), y);
  g.closePath(); g.fillStyle = '#e6d6a8'; g.fill();
  g.save(); g.clip();
  g.fillStyle = 'rgba(160,130,80,0.16)';
  for (let i = 0; i < 69; i++) g.fillRect(0, i * 27 + (i % 3) * 3, Wc, 2);
  g.fillStyle = 'rgba(120,95,55,0.35)'; g.fillRect(0, 0, Wc, 16); g.fillRect(0, Hc - 16, Wc, 16);
  g.restore();
}
function marker(g, w) { g.strokeStyle = INK; g.fillStyle = INK; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; }
function hand(g, text, x, y, size) { g.save(); g.translate(x, y); g.rotate(-0.03); g.font = `bold ${size}px "DejaVu Sans", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 0, 0); g.restore(); }
function token(g, x, y, rr) {   // жетон алчности, нарисованный маркером
  g.save(); g.fillStyle = '#c8382c'; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
  g.lineWidth = rr * 0.18; g.strokeStyle = '#d8a43a'; g.beginPath(); g.arc(x, y, rr * 0.82, 0, 7); g.stroke();
  marker(g, rr * 0.12); g.beginPath(); g.arc(x, y, rr, 0, 7); g.stroke(); g.restore();
}
function drawCoins(n) {
  // число монет — почти во всю высоту скотча, чтобы читалось на аппарате
  const g = tapeCv.getContext('2d'); paper(g); marker(g, 30);
  g.save(); g.translate(1536, 960); g.scale(0.8, 1); g.rotate(-0.03);
  g.font = 'bold 1500px "DejaVu Sans", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), 0, 40);
  g.restore();
  tapeTex.needsUpdate = true;
}
const shop = { wheel: 3, pach: 0, v2: 0, have: 11, need: { wheel: 6, pach: 6, v2: 24 }, press: null };
const popOut = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);   // с перехлёстом
function drawShop(rev = 1, pop = {}) {
  const g = tapeCv.getContext('2d'); paper(g);
  // видимая в упор часть длинного скотча — x ~1137…1886, y ~0…1175 из
  // 3072×1862; схема нарисована в прежних координатах и вписана сюда
  g.save(); g.translate(604, 0); g.scale(0.9, 0.9);
  // Видна середина куска: x ~584…1464 из 2048. Схема слева направо (игрок,
  // 17.11): колесо и пачинко слева, ветки сходятся вправо к аппарату v2.
  // rev 0..1 — схема проявляется по очереди (магазин «рисуется» на скотче).
  const N = { wheel: [820, 450], pach: [820, 940], v2: [1220, 700] };
  const part = (a, b) => clamp((rev - a) / (b - a));
  const node = (k, a, b, x, y, draw) => { const q = popOut(part(a, b)); if (q <= 0) return;
    g.save(); g.translate(x, y); g.scale(q, q); g.translate(-x, -y); g.globalAlpha = Math.min(1, part(a, b) * 2) * (g.globalAlpha); draw(); g.restore(); };
  const ring = (k, x, y, rx, ry) => { if (shop.press !== k) return; g.save(); g.strokeStyle = '#c8382c'; g.lineWidth = 16; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.stroke(); g.restore(); };
  const count = (k, x, y, txt) => { const q = 1 + 0.35 * Math.exp(-(pop[k] || 9) * 14); hand(g, txt, x, y, 96 * q); };
  // ветки: рисуются маркером от узлов к слиянию
  const L = part(0.45, 0.8);
  if (L > 0) { marker(g, 14); g.save(); g.setLineDash([900 * L, 2000]);
    g.beginPath(); g.moveTo(960, 450); g.bezierCurveTo(1060, 450, 1010, 700, 1100, 700); g.stroke();
    g.beginPath(); g.moveTo(960, 940); g.bezierCurveTo(1060, 940, 1010, 700, 1100, 700); g.stroke(); g.restore();
    if (L > 0.95) { g.beginPath(); g.moveTo(1128, 700); g.lineTo(1093, 672); g.lineTo(1093, 728); g.closePath(); g.fill(); } }
  node('have', 0, 0.3, 1000, 170, () => { token(g, 940, 165, 46); marker(g, 14); hand(g, `×${shop.have}`, 1070, 173, 88); });
  node('wheel', 0.12, 0.42, 820, 490, () => { const [x, y] = N.wheel; marker(g, 14); g.beginPath(); g.arc(x, y, 110, 0, 7); g.stroke();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 110, y + Math.sin(a) * 110); g.stroke(); }
    g.beginPath(); g.moveTo(x + 110, y); g.lineTo(x + 152, y - 20); g.lineTo(x + 152, y + 20); g.closePath(); g.fill();
    count('wheel', x, y + 175, `${shop.wheel}/${shop.need.wheel}`); ring('wheel', x + 10, y + 70, 200, 230); });
  node('pach', 0.25, 0.55, 820, 970, () => { const [x, y] = N.pach; marker(g, 14); g.strokeRect(x - 90, y - 150, 180, 230);
    g.beginPath(); g.moveTo(x - 66, y + 50); g.lineTo(x - 66, y - 70); g.arc(x, y - 70, 66, Math.PI, 0); g.lineTo(x + 66, y + 50); g.stroke();
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { g.beginPath(); g.arc(x - 40 + j * 40 + (i % 2) * 20, y - 70 + i * 30, 8, 0, 7); g.fill(); }
    count('pach', x, y + 150, `${shop.pach}/${shop.need.pach}`); ring('pach', x + 10, y + 30, 200, 240); });
  g.save(); g.globalAlpha = (shop.wheel >= 6 && shop.pach >= 6) ? 1 : 0.35;
  node('v2', 0.7, 1, 1220, 720, () => { const [x, y] = N.v2; marker(g, 14);
    g.strokeRect(x - 120, y - 170, 240, 110); g.strokeRect(x - 100, y - 60, 200, 90); g.strokeRect(x - 112, y + 30, 224, 70);
    g.beginPath(); g.arc(x - 60, y - 115, 36, 0, 7); g.stroke(); g.strokeRect(x + 20, y - 150, 66, 72);
    count('v2', x, y + 175, `${shop.v2}/${shop.need.v2}`); });
  g.restore();
  g.restore();
  tapeTex.needsUpdate = true;
}

// ---------- банка ----------
const jar = new THREE.Group(); scene.add(jar);
const body = new THREE.Group(); jar.add(body);
let coins = new THREE.Group(); body.add(coins);
const tokens = new THREE.Group(); body.add(tokens);
const tokenGeo = new THREE.CylinderGeometry(0.032, 0.032, 0.008, 24);
const tokenMat = [new THREE.MeshStandardMaterial({ color: 0xd8a43a, metalness: 0.6, roughness: 0.35 }),
                  new THREE.MeshStandardMaterial({ color: 0xc8382c, metalness: 0.2, roughness: 0.4 }),
                  new THREE.MeshStandardMaterial({ color: 0xc8382c, metalness: 0.2, roughness: 0.4 })];
// Классическая трёхлитровая банка (референс игрока, docs/ref/greed-jar-3l-*.jpg)
// телом вращения по профилю: скруглённое дно, тело чуть бочонком, плавные
// плечи, короткое горло с венчиком (два валика под крышку). Ширина к высоте
// ~0,66, горло ~0,45 ширины тела. Высота 0,45, как у прежней болванки.
const JH = 0.45, JR = 0.1485, JY0 = -0.32;
const PROFILE = [[0, 0], [0, 0.80], [0.012, 0.92], [0.035, 0.975], [0.08, 0.995], [0.30, 1.0], [0.45, 1.0], [0.60, 0.99],
  [0.70, 0.96], [0.78, 0.88], [0.84, 0.74], [0.88, 0.60], [0.905, 0.50], [0.92, 0.462], [0.932, 0.458], [0.942, 0.475],
  [0.955, 0.475], [0.963, 0.46], [0.973, 0.475], [0.99, 0.475], [1.0, 0.46], [1.0, 0.405]];
const ready = Promise.resolve().then(() => {
  const lathe = (prof, k) => new THREE.LatheGeometry(prof.map(([yn, rn]) => new THREE.Vector2(rn * JR * k, JY0 + yn * JH)), 72);
  const gold = new THREE.MeshStandardMaterial({ color: 0xe0a830, metalness: 0.45, roughness: 0.35, emissive: 0x3a2400 });
  const coin = new THREE.CylinderGeometry(0.028, 0.028, 0.006, 20);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 300; i++) { const m = new THREE.Mesh(coin, gold); const a = rnd() * 6.28, rr = Math.sqrt(rnd()) * JR * 0.8;
    // верх кучи ниже верха скотча (−0,082)
    m.position.set(Math.cos(a) * rr, -0.30 + rnd() * 0.20, Math.sin(a) * rr); m.rotation.set((rnd() - 0.5) * 1.4, rnd() * 3, (rnd() - 0.5) * 1.4); coins.add(m); }
  const glass = (c, o) => new THREE.MeshPhysicalMaterial({ color: c, transparent: true, opacity: o, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false });
  // внутренняя стенка — тот же профиль ужатый (толщина стекла), от дна вверх
  const inner = new THREE.Mesh(lathe(PROFILE.filter(([yn]) => yn > 0.02), 0.94), glass(0xdfeee8, 0.12)); inner.renderOrder = 2; body.add(inner);
  const outer = new THREE.Mesh(lathe(PROFILE, 1), glass(0xe8f4f0, 0.2)); outer.renderOrder = 3; body.add(outer);
  // скотч — на бочонке тела, ниже плеч (на плечах лёг бы криво)
  const tg = new THREE.CylinderGeometry(JR + 0.0008, JR + 0.0008, TAPE.y1 - TAPE.y0, 64, 1, true, Math.PI - TAPE.arc / 2, TAPE.arc);
  const tape = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ map: tapeTex, roughness: 0.85, side: THREE.FrontSide }));
  tape.position.y = (TAPE.y0 + TAPE.y1) / 2; tape.rotation.y = Math.PI; tape.renderOrder = 4; body.add(tape);
  // Крышки нет: из банки монета вылетает в монетоприёмник на каждой крутке
  // (игрок, 17.11).
  body.position.y = 0.095;   // середина банки — в начале координат группы
});

// ---------- раскадровка ----------
// позы: покой (на аппарате) и «в упор» (скотч во всю ширину, сверху горло)
// Покой: банка крупнее и наклонена — низ уходит под рамку в правый нижний
// угол (не висит в воздухе), верх и середина заходят на свободное место
// аппарата (игрок, 17.11).
const REST = { p: at(298, 676, 2.25), pitch: 6, roll: 18 };
// В упор: верх скотча — на трети экрана (y ~300), низ — сразу за рамкой
// (~790): высота скотча 0,10 на экране 490 точек → передняя стенка на
// 0,10·422/(490·tg20°) = 0,237 от камеры, середина банки на 0,237 + радиус;
// по высоте — середина скотча на y 545. Без наклона: так видимая часть
// скотча считается без догадок (x ~584…1464 из 2048 по ширине).
// (трёхлитровая: скотч ниже на 0,127, радиус больше на 0,006 — поза сдвинута на столько же)
const NEAR = { p: new THREE.Vector3(0, 0.012, -0.3854), pitch: 0 };
// ---------- режиссура (сек) ----------
// подготовка (присед) → отрыв (вытянулась) → полёт дугой с креном, быстрый
// старт и торможение у камеры, оборот разгоняется и тормозит → прибытие:
// перелёт к камере и пружина назад, доворот с перехлёстом → магазин
// «рисуется» → дыхание; жетон — отдача банки и подпрыгивание числа →
// выход: подаётся к игроку, с разгоном улетает с обратным оборотом,
// садится с приседом и отскоком. Открытие ~1 с, закрытие ~0,8 с.
const EV = { tap: 0.45, launch: 0.53, arrive: 1.13, settled: 1.55, taps: [1.95, 2.3, 2.65], hold: [3.05, 4.6],
             out: 5.0, away: 5.07, land: 5.52, rest: 5.95, end: 6.4 };
function deposits() {
  const list = [];
  EV.taps.forEach(t => list.push({ t, node: 'wheel' }));
  let t = EV.hold[0], dt = 0.3;
  while (t < EV.hold[1]) { list.push({ t, node: 'pach' }); t += dt; dt = Math.max(0.06, dt * 0.8); }
  return list;
}
const DEP = deposits();
const outCubic = (x) => 1 - Math.pow(1 - x, 3), inCubic = (x) => x * x * x;
const inOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = (s, f, damp) => Math.exp(-damp * s) * Math.sin(f * s);   // затухающее качание
function pose(t) {
  const P = { p: REST.p.clone(), pitch: REST.pitch, yaw: 0, roll: REST.roll, sx: 1, sy: 1, shopOn: false, rev: 0 };
  if (t < EV.tap) return P;
  if (t < EV.launch) {                                   // подготовка: присед
    const k = (t - EV.tap) / (EV.launch - EV.tap), q = Math.sin(k * Math.PI / 2);
    P.sy = 1 - 0.14 * q; P.sx = 1 + 0.08 * q; P.p.y -= 0.035 * q; return P;
  }
  if (t < EV.arrive) {                                   // полёт
    const u = (t - EV.launch) / (EV.arrive - EV.launch), k = outCubic(u);
    P.p = REST.p.clone().lerp(NEAR.p, k);
    P.p.y += Math.sin(u * Math.PI) * 0.22 * (1 - u * 0.4);
    P.p.x += Math.sin(u * Math.PI) * 0.06;
    P.p.z += -0.025 * Math.sin(u * Math.PI / 2) * Math.pow(u, 6) * 0;   // перелёт — в прибытии
    const st = Math.max(0, 1 - u / 0.22);                // отрыв: вытянулась и вернулась
    P.sy = 1 + 0.12 * st; P.sx = 1 - 0.06 * st;
    P.roll = REST.roll * (1 - k) - 11 * Math.sin(u * Math.PI);   // выпрямляется + крен в повороте
    P.pitch = REST.pitch * (1 - k) - 10 * Math.sin(u * Math.PI);
    P.yaw = 372 * inOut(u);                              // оборот с перехлёстом +12°
    P.shopOn = P.yaw > 180;
    return P;
  }
  const s = t - EV.arrive;
  if (t < EV.out) {                                      // прибытие и магазин
    P.p = NEAR.p.clone();
    P.p.z += 0.03 * spring(s, 22, 7);                    // перелёт к камере и пружина назад
    P.yaw = 360 + 12 * Math.exp(-9 * s) * Math.cos(16 * s);
    P.roll = 2.5 * spring(s, 18, 6);
    P.pitch = -3 * spring(s, 14, 5);
    P.p.y += 0.0025 * Math.sin(t * 3.4);                 // дыхание
    P.roll += 0.35 * Math.sin(t * 2.3);
    let rec = 0; DEP.forEach(d => { const a = t - d.t; if (a >= 0 && a < 0.4) rec += Math.exp(-a * 16); });
    P.p.y -= 0.004 * Math.min(1.5, rec); P.sy = 1 - 0.012 * Math.min(1.5, rec);   // отдача от жетона
    P.shopOn = true; P.rev = clamp((t - (EV.arrive - 0.03)) / 0.4);
    return P;
  }
  if (t < EV.away) {                                     // подаётся к игроку
    const q = Math.sin((t - EV.out) / (EV.away - EV.out) * Math.PI / 2);
    P.p = NEAR.p.clone(); P.p.z += 0.012 * q; P.sx = P.sy = 1 + 0.02 * q; P.shopOn = true; P.rev = 1; P.yaw = 360;
    return P;
  }
  if (t < EV.land) {                                     // улетает с разгоном и обратным оборотом
    const u = (t - EV.away) / (EV.land - EV.away), k = inCubic(u) * 0.6 + u * 0.4;
    P.p = NEAR.p.clone().lerp(REST.p, k);
    P.p.y += Math.sin(u * Math.PI) * 0.2;
    P.p.x += Math.sin(u * Math.PI) * 0.05;
    P.roll = REST.roll * k + 9 * Math.sin(u * Math.PI);
    P.pitch = REST.pitch * k - 6 * Math.sin(u * Math.PI);
    P.yaw = 360 * (1 - inOut(u));
    P.shopOn = P.yaw > 180; P.rev = 1;
    return P;
  }
  const L = t - EV.land;                                 // посадка: присед и отскок
  P.sy = 1 - 0.16 * spring(L, 26, 9) - 0.0; P.sx = 1 + 0.08 * spring(L, 26, 9);
  P.p.y += 0.07 * Math.max(0, spring(L + 0.05, 20, 10));
  P.roll = REST.roll - 2 * spring(L, 22, 8);
  return P;
}
window.frame = async (t) => {
  await ready;
  const P = pose(t);
  jar.position.copy(P.p); jar.scale.set(P.sx, P.sy, P.sx);
  jar.rotation.set(P.pitch * D, P.yaw * D, P.roll * D, 'XYZ');
  // Монеты убираются, только когда их и так не видно: в упор куча целиком
  // за скотчем (её верх ниже верха скотча). Убирать раньше — видно, как они
  // пропадают (игрок, 17.11).
  coins.visible = !(t > EV.arrive + 0.05 && t < EV.away);
  if (P.shopOn) {
    let w = 3, pc = 0, press = null; const pop = {};
    DEP.forEach(d => { if (t >= d.t) { if (d.node === 'wheel') w++; else pc++; pop[d.node] = t - d.t; }
      if (t >= d.t && t < d.t + 0.18) press = d.node; });
    if (t >= EV.hold[0] && t < EV.hold[1]) press = 'pach';
    shop.wheel = Math.min(6, w); shop.pach = Math.min(6, pc); shop.have = 11 - (shop.wheel - 3) - shop.pach; shop.press = press;
    drawShop(P.rev, pop);
  } else drawCoins(200);
  // жетоны: падают сверху в горло и пропадают за скотчем
  tokens.children.slice().forEach(c => tokens.remove(c));
  if (P.shopOn && t < EV.out) DEP.forEach((d, i) => {
    const age = t - d.t; if (age < 0 || age > 0.75) return;
    const m = new THREE.Mesh(tokenGeo, tokenMat);
