<!doctype html>
<meta charset="utf-8">
<title>Аудит ванной</title>
<!-- Площадка для разбора ЗАПЕЧЁННОЙ ванной (tools/audit-bath.js): ни стилей,
     ни игры, только палитра и предметы из bath-baked.js.

     Фон нейтрально-серый, а не розовый: предметы здесь оценивают ГЛАЗОМ, и
     ядовитый фон мешает судить о цвете. Дыры при этом всё равно видно —
     серого в палитре ванной нет. -->
<style>
  html, body { margin: 0; background: #8d8d93; font: 12px system-ui; color: #fff; }
  .grid { display: flex; flex-wrap: wrap; }
  .cell { padding: 6px; }
  .cap { opacity: 0.85; padding: 2px 0 0 2px; }
  svg { display: block; background: #8d8d93; }
</style>
<div class="grid" id="grid"></div>
<script src="../src/core/palette.js"></script>
<script src="../src/minigames/lust/bath-baked.js"></script>
<script>
// Одна плитка: предмет по центру своей рамки с полем вокруг.
window.tile = (name, side, pad) => {
    const it = BATH_BAKED.items[name];
    if (!it) return null;
    const b = it.box, m = pad == null ? 0.12 : pad;
    const w = b.w * (1 + m * 2), h = b.h * (1 + m * 2);
    const s = Math.max(w, h);
    const vb = `${b.x - (s - b.w) / 2} ${b.y - (s - b.h) / 2} ${s} ${s}`;
    return `<div class="cell"><svg viewBox="${vb}" width="${side}" height="${side}">`
         + BATH_BAKED.draw(name) + `</svg><div class="cap">${name} `
         + `${it.d.length} путей ${b.w}×${b.h}</div></div>`;
};

// Все предметы разом — контактный лист.
window.sheet = (side) => {
    const names = Object.keys(BATH_BAKED.items);
    document.getElementById('grid').innerHTML =
        names.map(n => tile(n, side || 250)).join('');
    return names;
};

// Несколько предметов вместе, крупно: предмет из двух половин по одной не
// читается — надо видеть, как они стыкуются.
window.group = (names, side) => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const n of names) {
        const b = BATH_BAKED.items[n].box;
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
        x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
    }
    const w = x1 - x0, h = y1 - y0, s = Math.max(w, h) * 1.1;
    const vb = `${x0 - (s - w) / 2} ${y0 - (s - h) / 2} ${s} ${s}`;
    document.getElementById('grid').innerHTML =
        `<div class="cell"><svg viewBox="${vb}" width="${side}" height="${side}">`
        + names.map(n => BATH_BAKED.draw(n)).join('') + '</svg></div>';
    return { x: x0, y: y0, w, h };
};

// Один предмет крупно.
window.one = (name, side) => {
    document.getElementById('grid').innerHTML = tile(name, side || 700, 0.06);
    return BATH_BAKED.items[name].box;
};
</script>
