<!doctype html><html><head><meta charset="utf-8">
<!-- Гримёрка тщеславия отдельно от игры: проход как картинка или свет
     шейдером при заданном наклоне. Снимает tools/shot-pride-room.js. -->
<style>body{margin:0;background:#222}#wrap{position:relative;width:390px;height:844px}
#wrap>*{position:absolute;left:0;top:0;width:390px;height:844px}</style></head><body>
<div id="wrap"><canvas id="cv"></canvas><div id="baked"></div><svg id="ov" viewBox="0 0 390 844"></svg></div>
<script src="../src/core/palette.js"></script>
<script src="../src/core/materials.js"></script>
<script src="../src/core/lit.js"></script>
<script src="../src/core/lit-gl.js"></script>
<script src="../src/minigames/pride/pride-room.js"></script>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'lit';
window.T = { x: +(q.get('tx') || 0), y: +(q.get('ty') || 0) };
(async () => {
  document.getElementById('ov').innerHTML = q.get('nobulbs') ? '' : PRIDE_ROOM.bulbsOverlay();
  if (mode === 'lit') {
    const t0 = performance.now();
    const R = await LitGL.create(document.getElementById('cv'), PRIDE_ROOM.litOptions());
    window.R = R;
    if (!R) { document.title = 'NOGL'; return; }
    const t1 = performance.now();
    R.draw(window.T);
    window.timing = { build: t1 - t0 };
    document.title = 'READY';
  } else {
    // проход как картинка
    const svg = PRIDE_ROOM.svg(mode, q.get('parts') ? q.get('parts').split(',') : null);
    document.getElementById('baked').innerHTML = svg;
    document.title = 'READY';
  }
})().catch(e => { document.title = 'ERR ' + e.message; console.error(e); });
</script></body></html>
