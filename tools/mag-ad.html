<!doctype html>
<!-- Стенд рекламного листа журнала (src/minigames/lust/mag-ad-art.js).
     Открывается без игры: только палитра и рисунок листа. Режим —
     параметром ?state=buy|poor|max, снимает tools/shot-mag-ad.js. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #111; }
  #sheet { width: 330px; height: 442px; }
  #sheet > svg { width: 100%; height: 100%; display: block; }
</style>
<script src="../src/core/palette.js"></script>
<script src="../src/config/economy.js"></script>
<script>
  // mixColor живёт в worm-paint.js, а тот тянет за собой всего червя.
  // Предметам ванной нужна только эта смесь — копия здесь.
  function mixColor(a, b, t) {
    const p = (c) => c[0] === '#' ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/[\d.]+/g).slice(0, 3).map(Number);
    const x = p(a), y = p(b), k = Math.max(0, Math.min(1, t));
    return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(',')})`;
  }
</script>
<script src="../src/core/token-art.js"></script>
<script src="../src/minigames/lust/bath-baked.js"></script>
<script src="../src/minigames/lust/bath-art.js"></script>
<script src="../src/minigames/lust/bath-soap.js"></script>
<script src="../src/minigames/lust/bath-cloth.js"></script>
<script src="../src/minigames/lust/mag-ad-art.js"></script>
</head><body>
<div id="sheet"></div>
<script>
  const Q = new URLSearchParams(location.search);
  // На стенде нет простоя, который доводит тяжёлые ступени (bath-cloth.js, warm).
  BATH_CLOTH.deferHeavy = false;
  const A = MAG_AD, C = A.C(), U = ECONOMY.minigames.lust.upgrades;
  const steps = (k) => U[k].levels.length;
  // Состояние (?state=): buy — по карману, печать стоит; poor — не хватает,
  // печати нет; max — всё выкуплено, ни цены, ни печати, все звёзды литые.
  const state = Q.get('state') || 'buy';
  const lvl = (k) => state === 'max' ? steps(k) : 3;
  const price = (k) => { const p = U[k].levels[lvl(k)].price; return p[Object.keys(p)[0]]; };
  // Предмет СЛЕДУЮЩЕЙ ступени в чаше — тот же рисунок, что на полке ванной.
  const item = (L, cx, cy, a, b) => {
    const next = Math.min(lvl(L === BATH_SOAP ? 'soap' : 'cloth') + 1, L.TIERS ? L.TIERS.length - 1 : 8);
    const box = L.box(next), k = Math.min(2 * a * 0.78 / box.w, 2 * b * 0.84 / box.h);
    return `<g transform="translate(${cx} ${cy}) scale(${k.toFixed(3)}) translate(${-(box.x + box.w / 2)} ${-(box.y + box.h / 2)})">${L.draw(next)}</g>`;
  };
  // Медальоны новой формы (раунд 2): хвост — овал стоймя, мыло — лёжа,
  // мочалка — скруглённый прямоугольник. Окна, кроме мыла, — без цены.
  const tail  = (w, h) => A.medal(100, 90, 46, 62, 'deco') + A.stars('tail', 228, 108, lvl('tail'));
  const cloth = (w, h) => A.medal(w / 2, 62, 50, 36, 'pearl', item(BATH_CLOTH, w / 2, 62, 50, 36)) + A.stars('cloth', w / 2, 172, lvl('cloth'));
  const soapMedal = (w) => A.medal(w / 2, 60, 50, 35, 'cart', item(BATH_SOAP, w / 2, 60, 50, 35));
  const buy = state === 'buy', has = state !== 'max', p = has ? price('soap') : 0;
  const seal = (x, y, r, tails, len) => buy ? A.seal(x, y, r, 'soap', tails, len) : '';
  // Связка «предмет — цена — печать» (выбор игрока, раунд 2): бирка на
  // шнурке справа под медальоном, ушко шнура — на ободе медальона снизу
  // справа; печать слева от бирки, в одной строке с ценой.
  const ring = (() => { const t = 70 * Math.PI / 180; return [74 + 54.6 * Math.cos(t), 60 + 39.6 * Math.sin(t)]; })();
  const soap = (w, h) => soapMedal(w) + A.stars('soap', w / 2, 188, lvl('soap')) +
                 (has ? seal(38, 132, 24, [20, -20], 1.25) + A.priceTag(132, 134, p, ring) : '');
  const windows = { tail, cloth, soap };
  document.getElementById('sheet').innerHTML = A.page({ windows });
  document.title = 'ready';
</script>
</body></html>
